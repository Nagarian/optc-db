captain:
  name: ""
  description: Reduces Special Cooldown of Powerhouse characters by 1 turn at the
    start of the fight, reduces crew's current HP by 10% at the end of each
    turn, boosts ATK of Powerhouse characters by 3x if there are 6 Powerhouse
    characters in your crew and boosts HP of Powerhouse characters by 1.1x-2x
    depending on how many Powerhouse characters are in your crew.
  notes: Hody's HP boost is dependent on how many Powerhouse characters are in
    your crew. With 6 Powerhouse characters, the boost is 2x, with 5 the boost
    is 1.5x, with 4 the boost is 1.4x, with 3 the boost is 1.3x, with 2 the
    boost is 1.2x and with 1 the boost is 1.1x.
