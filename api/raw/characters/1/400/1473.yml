special:
  name: Tears of Courage
  description: Changes all orbs, including [BLOCK] orbs, into [RAINBOW] orbs,
    recovers 100x character's RCV in HP.
  cooldown: 22
  maxLevel: 5
  stages:
    - description: Changes orbs, including [BLOCK] orbs, of adjacent characters into
        [RAINBOW] orbs, recovers 9x character's RCV in HP.
      cooldown: 13
  notes: Rainbow orbs are the beneficial form of [BLOCK] orbs. They can not be
    shuffled or swapped by you or your opponent. They count as beneficial orbs
    to any character. They do not count as [STR] orbs for Sakazuki but do act
    like Matching orbs for Black Clad Ace or Fujitora captain abilities.
