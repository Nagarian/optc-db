captain:
  name: ""
  description: >-
    Boosts ATK of all characters by 2.5x and their HP by 1.3x  

    **Action:** Sanji Sky Walks into the air and is unable to attack for 1 turn, preventing all debuffs to himself (Including, but not limited to, Bind, Despair, Silence and Paralysis). This does not remove his own Captain boost while he is unable to attack. During the next turn, boosts ATK of this character by 6.25x instead
  notes: Sanji Captain Action lasts for 2 turns and can be reactivated after no
    cooldown. Even while Sky Walking, will still boost all characters by 2.5x.
    Sky Walk is not a Type boost and will stack with other boosts
