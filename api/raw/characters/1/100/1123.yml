captain:
  name: ""
  description: Boosts ATK of [STR], [DEX] and [QCK] characters by 2.5x, but boosts
    ATK of this character by 4x
  notes: Cavendish only boosts Friend or Sub Cavendish by 2.5x for a total of 10x
    boost with two Cavendish captains
special:
  name: Slicing Winds of Rommel
  description: Removes all positive buffs on your team. Deals 15x character's ATK
    in Typeless damage to all enemies. Boosts ATK of this character by 2.25x for
    2 turns, boosts Orb Effects of this character by 1.5x for 2 turns, locks own
    orb for 2 turns and changes the orb of this character into a [QCK] orb.
  cooldown: 20
  maxLevel: 6
  notes: Boosted ATK and Orb Effectiveness only works for the character who uses
    their own Special.
sailor:
  - description: If this character has an [QCK] orb and you hit a PERFECT with him,
      keep his [QCK] orb for the next turn
  - description: Boosts base ATK of this character by 200 if this character is the
      last in the chain to attack
support:
  type: descriptive
  criteria: "[QCK] Characters"
  levels:
    - Once per adventure, when the supported character uses their special,
      changes the orb of the supported character into a [QCK] orb, locks
      supported character's orb for 1 turn, boosts ATK of supported character by
      1.1x for 1 turn and boosts Orb Effects of the supported character by 1.1x
      for 1 turn.
    - Once per adventure, when the supported character uses their special,
      changes the orb of the supported character into a [QCK] orb, locks
      supported character's orb for 1 turn, boosts ATK of supported character by
      1.2x for 1 turn and boosts Orb Effects of the supported character by 1.2x
      for 1 turn.
    - Once per adventure, when the supported character uses their special,
      changes the orb of the supported character into a [QCK] orb, locks
      supported character's orb for 1 turn, boosts ATK of supported character by
      1.3x for 1 turn and boosts Orb Effects of the supported character by 1.3x
      for 1 turn.
    - Once per adventure, when the supported character uses their special,
      changes the orb of the supported character into a [QCK] orb, locks
      supported character's orb for 1 turn, boosts ATK of supported character by
      1.4x for 1 turn and boosts Orb Effects of the supported character by 1.4x
      for 1 turn.
    - Once per adventure, when the supported character uses their special,
      changes the orb of the supported character into a [QCK] orb, locks
      supported character's orb for 1 turn, boosts ATK of supported character by
      1.5x for 1 turn and boosts Orb Effects of the supported character by 1.5x
      for 1 turn.
