captain:
  name: ""
  description: Boosts ATK of all characters by 2.75x and their HP by 1.5x if you
    have a Striker, Shooter, Fighter and Slasher on your crew. Attacks will
    ignore damage reducing Barriers and Buffs.
  notes: Attacks are still affected by DEF value. DEF boost buffs (Blue shield)
    still reduce your damage and you can not kill through Resilience, but Damage
    Negating (Yellow shield), % Damage Reduction (Rainbow shield), Barriers and
    Threshold Damage Reduction are ignored. Multiple class characters count as a
    character of each class. Enemy attacks will go through YOUR defensive buffs.
special:
  name: World Shaking Impact
  description: Deals 30% of enemies' current HP in damage to all enemies. If
    Blackbeard is a captain, this ability will ignore damage negating abilities
    and barriers
  cooldown: 25
  maxLevel: 7
  notes: If Blackbeard is not a captain, the effect works exactly like Whitebeard
    special and is affected by barriers.
