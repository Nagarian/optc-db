special:
  name: Yasakani no Magatama
  description: Changes all orbs of Shooter and Slasher characters into Matching
    orbs. Recovers 10x character's RCV in HP. Deals 10 hits of large random
    Typeless damage to random enemies.
  cooldown: 20
  maxLevel: 4
  stages:
    - description: For Shooter and Slasher characters, randomizes all non-Matching
        orbs. Deals 10 hits of small random Typeless damage to random enemies.
      cooldown: 6
    - description: For Shooter and Slasher characters, randomizes all non-Matching
        orbs. Recovers 5x character's RCV in HP. Deals 10 hits of random
        Typeless damage to random enemies.
      cooldown: 12
  notes: |-
    `random : 1,000 : 3,000 : for each hit on Stage 1`  
    `random : 3,000 : 6,000 : for each hit on Stage 2`  
    `random : 10,000 : 16,000 : for each hit on Stage 3`
