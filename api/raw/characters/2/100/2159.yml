    `poison : 50x`  

    Limit Break EX: `poison : 150x`  

    To poison all enemies, the damage dealt with normal attacks must exceed 300,000 and the poison does not bypass immunity.
special:
  name: "Venom Demon: Hell's Judgement"
  description: Inflicts Toxic to all enemies, recovers 13x character's RCV in HP
    at the end of each turn for 3 turns. If enemies are inflicted with Toxic or
    Poison upon activation of the special, delays all enemies by 1 turn.
  cooldown: 19
  maxLevel: 6
  notes: >-
    `toxic : 50x (70x with LLB) : 2x : 3,000,000 (5,000,000 with LLB)`  

    Delay effect will not trigger from the Toxic in Magellan's special; the enemy must already be poisoned.  

    If enemies are both Poisoned and inflicted with Toxic, only the Toxic damage will damage the enemy at the end of the turn.
