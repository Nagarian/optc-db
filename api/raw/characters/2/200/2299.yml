    you defeat an enemy, increases ATK boost slightly. Stacks up to 6 times to a
    maximum of 2.5x.
  notes: If a character dies and revives, it counts as killing a character. If you
    did not defeat an enemy, lose all ATK boost stacks.
special:
  name: Mischievous Love-Love Beam
  description: Reduces the defense of all enemies by 80% for 1 turn, reduces
    enemies' Threshold Damage Reduction, ATK Up, End of Turn Heal and Resilience
    Buffs duration by 2 turns, recovers 10,310 HP, changes [EMPTY] orb of
    Captain character into an [INT] orb and locks your Captain's orb for 1 turn.
    If your Captain's orb is [INT] at the time the special is activated, boosts
    ATK against enemies with reduced defense by 1.75x for 1 turn and changes the
    orb of Captain character into a [PSY] orb. If your Captain's orb is [PSY] at
    the time the special is activated, boosts Orb Effects of Shooter characters
    by 2x for 1 turn and changes the orb of Captain character into an [INT] orb.
  cooldown: 38
  maxLevel: 8
