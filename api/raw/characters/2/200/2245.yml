captain:
  name: ""
  description: >-
    Boosts ATK of this character by 3x and boosts ATK of all other
    characters by 2.75x and their HP by 1.3x and makes [TND] orbs beneficial for
    all characters  

    **Action:** Sanji Sky Walks into the air and is unable to attack for 1 turn, preventing all debuffs to himself (Including, but not limited to, Bind, Despair, Silence and Paralysis). This does not remove own Captain boost while he is unable to attack. After 1 turn, boosts ATK of this character by 8.25x instead for 1 turn.
  notes: Sanji Captain Action lasts for 2 turns and can be reactivated after no
    cooldown. Even while Sky Walking, will still boost all characters. Sky Walk
    is not a type boost and will stack with other boosts
special:
  name: Diable Mouton Shot
  description: Deals 100,000 Fixed damage to all enemies, changes [BLOCK] and
    [TND] orbs into Matching orbs and changes all orbs of this and adjacent
    characters into Matching orbs and adds 0.8x to Chain multiplier for 1 turn.
    If Sanji is your Captain or Friend/Guest Captain, reduces Chain Multiplier
    Limit and Chain Coefficient Reduction duration by 5 turns.
  cooldown: 19
  maxLevel: 6
