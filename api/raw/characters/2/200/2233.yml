captain:
  name: ""
  description: >-
    **Always Active:** Boosts HP of [STR], [DEX] and [QCK] characters
    by 1.2x and changes [RCV] orbs into [SEMLA] orbs.  

    **Standard Captain:** Boosts ATK of [STR], [DEX] and [QCK] characters by 3.5x  

    **Powered Up Captain:** Boosts ATK of [STR], [DEX] and [QCK] characters by 4x and reduces damage received by 15%  

    **Rampage Captain:** Boosts ATK of this character by 10x and own attacks will ignore damage reducing Barriers and Buffs, boosts ATK of [STR], [DEX] and [QCK] characters by 3.75x
  notes: >-
    [SEMLA] orbs replace [RCV] orbs, are beneficial for all characters and
    heal at the end of the enemy turn and can not be controlled by special
    abilities.  

    In order to Power Up Big Mom, you must eat a [SEMLA] orb and will be powered up the following turn.  

    While in Rampage, Big Mom will always attack a random enemy on her own, even while Binded or Paralyzed and hit a HUNGRY, which deals the same damage as a PERFECT. This attack occurs after your chain, so Big Mom's attack will not be affected by Chain Limiters, Chain Boosters, or Chain Lockers. You can not activate Big Mom's special while in Rampage. To exit Rampage, you must consume a [SEMLA] orb.
special:
  name: Temper Tantrum
  description: Deals 250x character's ATK in Typeless damage to one enemy and
    changes the orb of this character into a [STR] orb. If Big Mom is your
    Captain or Friend/Guest Captain, boosts ATK of top row characters by 2x for
    3 turns and boosts Orb Effects of top row characters by 2x for 3 turns. If
    she is a Sailor, boosts ATK of this character by 2x for 1 turn and boosts
    Orb Effects of this character by 2x for 1 turn instead
  cooldown: 15
  maxLevel: 6
