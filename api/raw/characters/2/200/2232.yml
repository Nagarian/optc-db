captain:
  name: ""
  description: Reduces HP of all characters by 20%, reduces damage received by
    13%, boosts chances of getting [RCV] orbs, makes [RCV] orbs beneficial for
    all characters, boosts ATK of all characters by 2x-3.75x depending on the
    amount healed in the last turn.
  notes: The range of ATK boost is from 2x to 3.75x. The exact boost is calculated
    as 2 + \* 0.000175 and maxes at 10k HP healed. This ignores your max HP, so
    it doesn't stop counting if you over-heal.
special:
  name: Kingdom Come
  description: Deals 25x Excess Healing done before the special is activated in
    Typeless damage to all enemies.
  cooldown: 21
  maxLevel: 6
  notes: The Excess Healing is counted from the last time the special is used and
    accumulates when you heal more than your maximum HP. For example, if you are
    at max HP and you heal 1,000 HP, you will add 25k damage to the special. The
    amount of damage possible caps at 5,000,000 damage (9,000,000 with LLB).
