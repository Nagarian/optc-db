captain:
  name: ""
  description: Boosts ATK of all characters by 2x, by 2.75x instead if HP is above
    99% at the start of the turn, deals 10% of enemies' current HP in damage to
    all enemies at the end of each turn and revives the team after a GAME OVER
    once per adventure.
  notes: The revive is not Resilience since you can still die, it's similar to
    using a gem to revive. This does not work when you are despaired as it
    nullifies all captain effects.
special:
  name: Tenacious "Shout of the Soul"
  description: Recovers 14,343 HP, reduces damage received by 90% for 1 turn and
    makes [STR], [DEX], [QCK], [PSY] and [INT] orbs beneficial for all
    characters for 2 turns. If the HP of the enemy with the highest Maximum HP
    is below 434,300, instantly defeats all enemies, otherwise, delays all
    enemies by 1 turn, deals 20% of enemies' current HP in damage to all
    enemies.
  cooldown: 19
  maxLevel: 6
