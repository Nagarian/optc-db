captain:
  name: ""
  description: Boosts ATK of all characters by 2x at the start of the chain and
    their HP by 1.5x, boosts ATK of all characters by 4x following a chain of
    Good > Great > PERFECT hits, makes [PSY] and [RCV] orbs beneficial for all
    characters. Reduces ATK based on how many Striker, Shooter or Cerebral
    characters you have on your crew.
  notes: ATK reduction is 0.2x for each Striker, Shooter or Cerebral class on your
    team. This stacks if you have each class on your team, so a team with a
    Striker, Shooter, and Cerebral character will get a 99.2% ATK reduction from
    Garp.
