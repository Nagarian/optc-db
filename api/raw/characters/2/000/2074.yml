captain:
  name: ""
  description: >-
    **Always Active:** Boosts HP of all characters by 1.25x, boosts
    chances of getting [STR], [QCK], [PSY] orbs.  

    **Gear 2 Captain:** Boosts ATK of all characters by 3x, slightly boosts chances of getting [RCV] orbs and makes [QCK] orbs beneficial for all characters  

    **Gear 3 Captain:** Boosts ATK of all characters by 3.5x after 2 consecutive PERFECTs, boosts chances of getting [RCV] orbs and makes [STR] orbs beneficial for all characters  

    **Gear 4 - Boundman Captain:** Boosts ATK of all characters by 4x, reduces damage received by 20%, boosts chances of getting [RCV] orbs and makes [STR], [QCK] and [PSY] orbs beneficial for all characters  

    **Gear 4 - Tankman Captain:** Boosts ATK of this character by 4.25x, boosts ATK of all other characters by 4x, reduces damage received by 50% and makes [STR], [QCK] and [PSY] orbs beneficial for all characters  

    **Action:** Based on how full Gear Power Gauge is, transforms Luffy. If Gear Power is above 50%, changes between Gear 2 and Gear 3. If Gear Power is full, changes into Gear 4 - Boundman. This can be used an unlimited number of times per turn.
  notes: In order to increase Gear Power Gauge level, you must hit a PERFECT with
    Luffy or consume [RCV] orbs. MAX Gear Power Gauge level is 8. Hitting a
    PERFECT with Luffy and consuming a [RCV] orb increases Gauge level by 1. If
    Luffy gets swapped out in battle, Gear Gauge Power will go to 0. While in
    Gear 4, Luffy will stay in that form until Gauge Power goes to 0. Attacking
    with any character while in Gear 4 reduces Gear Power Gauge by 3.
special:
  name: Gomu Gomu no Kong Organ
  description: Deals 150x character's ATK in Typeless damage to all enemies,
    boosts ATK of all characters by 2x for 1 turn, makes [RCV] and [TND] orbs
    beneficial for all characters for 3 turns. If Luffy is Captain or
    Friend/Guest Captain, transform into Gear 4
  cooldown: 19
  maxLevel: 6
  notes: If you use this special after consuming 10 [RCV] orbs since the start of
    the fight, transform into Tankman, otherwise transform into Boundman
