    by 4x at the start of the chain, by 4.25x after 3 PERFECTs in a row
special:
  name: Gomu Gomu no King Cobra
  description: Deals 150x character's ATK in Typeless damage to one enemy, adds
    0.7 to chain multiplier for 3 turns, boosts Orb Effects of all characters by
    1.75x for 1 turn. If during that turn you score 3 PERFECT hits, boosts Orb
    Effects of all characters by 2x for 1 turn in the following turn. If Luffy
    is your Captain or Friend/Guest Captain, makes [STR], [DEX], [QCK], [PSY]
    and [INT] orbs beneficial for all characters for 3 turns
  cooldown: 19
