captain:
  name: ""
  description: Boosts ATK of Shooter characters by 3.75x and their HP by 1.35x and
    makes [PSY] and [INT] orbs beneficial for Shooter characters. If there are 6
    Shooter characters in your crew, recovers 0.5x this character's RCV at the
    end of the turn for each time you hit a PERFECT
special:
  name: Full-Scale Rook! The Big Father
  description: Boosts ATK of Shooter characters by 2x for 1 turn. If there are 6
    characters in your crew at the time the special is activated, reduces crew's
    current HP by 85%, transforms crew into Big Father and turns the amount of
    HP subtracted into Big Father's Barrier.
  cooldown: 21
  maxLevel: 6
  notes: While Big Father is active, crew's HP isn't able to be reduced and
    becomes immune to Blow Away inflicted to the crew. Big Father deactivates
    when the Barrier HP is reduced to 0 HP. While in Big Father, you can not use
    Captain Swap or Captain Actions. If a Captain Swap or Captain Action is
    already active, you can not transform into Big Father.
