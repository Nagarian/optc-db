  description: Boosts ATK of Fighter and Powerhouse characters by 2.5x and their
    HP by 1.2x. Deals 3x the damage taken from enemies in the previous turn in
    Typeless damage to all enemies at the end of each turn.
special:
  name: Scorching Fist
  description: Removes any Orb Rate Up and Orb Rate Down Buffs, changes [STR],
    [DEX], [QCK], [PSY] and [INT] orbs into [EMPTY] orbs, deals 7x-350x
    character's ATK in [STR] damage to one enemy, depending on number of [STR],
    [DEX], [QCK], [PSY] or [INT] slots emptied. Changes all orbs into Matching
    orbs. If enemies have All Debuff Protection, Delay Debuff Protection or
    Poison Debuff Protection at the time the special was activated, boosts Orb
    Effects of [STR], [DEX] and [QCK] characters by 1.75x for 1 turn. If during
    that turn you score 4 PERFECT hits, boosts Orb Effects of [STR], [DEX] and
    [QCK] characters by 1.75x for 2 turns in the following turn.
  cooldown: 28
  maxLevel: 15
  notes: "The exact multiplier used is chosen based on the number of [STR], [DEX],
    [QCK], [PSY] or [INT] orbs consumed: 0 orbs - 7x ATK; 1 orb - 52.5x ATK; 2
    orbs - 105x ATK; 3 orbs - 157.5x ATK; 4 orbs - 210x ATK; 5 orbs - 262.5x
    ATK; 6 orbs - 350x ATK."
