      last in the chain to attack
support:
  type: descriptive
  criteria: "[QCK] Characters"
  levels:
    - Once per adventure, when the supported character uses their special,
      changes orb of the supported character into a [QCK] orb, locks supported
      character's orb for 1 turn, boosts ATK of supported character by 1.1x for
      1 turn and boosts Orb Effects of the supported character by 1.1x for 1
      turn.
    - Once per adventure, when the supported character uses their special,
      changes orb of the supported character into a [QCK] orb, locks supported
      character's orb for 1 turn, boosts ATK of supported character by 1.2x for
      1 turn and boosts Orb Effects of the supported character by 1.2x for 1
      turn.
    - Once per adventure, when the supported character uses their special,
      changes orb of the supported character into a [QCK] orb, locks supported
      character's orb for 1 turn, boosts ATK of supported character by 1.3x for
      1 turn and boosts Orb Effects of the supported character by 1.3x for 1
      turn.
    - Once per adventure, when the supported character uses their special,
      changes orb of the supported character into a [QCK] orb, locks supported
      character's orb for 1 turn, boosts ATK of supported character by 1.4x for
      1 turn and boosts Orb Effects of the supported character by 1.4x for 1
      turn.
    - Once per adventure, when the supported character uses their special,
