captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns at the start
    of the fight. For 12 turns after the start of the fight, boosts ATK of
    Fighter, Slasher, Striker, Shooter and Cerebral characters by 2x, boosts
    chances of getting Matching orbs and attacks will ignore damage reducing
    Barriers and Buffs. After 12 turns, boosts ATK of Fighter, Slasher, Striker,
    Shooter and Cerebral characters by 2.75x.
  notes: >-
    The bonus is cumulative. Characters with 2 of the boosted classes get a
    4x bonus for the first 12 turns  

    Attacks are still affected by DEF value. DEF boost buffs (Blue shield) still reduce your damage and you can not kill through Resilience, but Damage Negating (Yellow shield), % Damage Reduction (Rainbow shield), Barriers and Threshold Damage Reduction are ignored. Enemy attacks will go through YOUR defensive buffs.
