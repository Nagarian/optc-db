    times the crew's total base RCV.
special:
  name: Heavenly Fire and Lightning Ring & Mama Mash
  description: Boosts base ATK of all characters by 1-1,000 for 1 turn, depending
    on your current HP and becomes Zeus & Prometheus & Big Mom for 3 turns. If
    HP is above 50% at the time the special is activated, locks the chain
    multiplier at 3.5x for 1 turn.
  cooldown: 16
  maxLevel: 7
  notes: Base ATK boost is equal to current HP/100, the maximum effect at 100,000
    HP will give a 1,000 base ATK boost.
