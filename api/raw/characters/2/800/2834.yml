characters:
  swap:
    description: If this character has no stored orbs, stores current orbs and
      changes all orbs into [EMPTY] orbs. If this character has stored orbs,
      restores orbs into slots.
    notes: The storing and emptying of orbs will work on all orbs, including
      [BLOCK], [RAINBOW], [SEMLA] and [WANO]. However, you can not override
      [RAINBOW], [SEMLA] or [WANO] orbs with other orbs. The Swap can not store
      [EMPTY] orbs; if all orbs are empty, the swap will occur without any
      additional effects if there's no stored orbs.
