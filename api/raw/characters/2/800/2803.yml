  description: >-
    Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of all characters by 3.5x, boosts chances of
    getting [TND] orbs, and makes [TND] orbs beneficial for all characters. If a
    character has a [TND] orb, boosts their ATK by 4.25x instead.  

    **Action:** Sanji becomes Transparent and prevents all debuffs to himself (including, but not limited to, Bind, Despair, Silence, Slot Bind, Special Rewind, and Paralysis), makes own normal attacks ignore defense, damage reducing Barriers and Buffs, and adds 500x character's ATK as Additional Typeless Damage to own's attacks.
  notes: Sanji Captain Action lasts for 3 turns and can be reactivated after 6 turns.
