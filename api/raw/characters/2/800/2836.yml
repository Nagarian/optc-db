captain:
  name: ""
  description: Boosts ATK of [INT] characters by 3.5x, by 4.25x instead if they
    have a beneficial orb, their HP by 1.25x, makes [PSY] orbs beneficial for
    [INT] characters and boosts chances of getting [PSY] orbs.
special:
  name: One Last Request
  description: Changes [EMPTY], [BLOCK], Badly Matching orbs into Matching orbs
    and changes the orb of this character into a Matching orb, reduces Special
    Cooldown of all characters by 1 turn. If this character has no stored buffs,
    copies one selected buff and advances Special Cooldown of this character to
    MAX. If this character has a stored buff, reapply that buff with a duration
    of 1 turn.
  cooldown: 12
  maxLevel: 6
  notes: Compatible buffs include, but are not limited to, ATK UP, Orb
    Amplification, Affinity Boost, Chain Lock and Chain Boost. When storing a
    buff, the buff will not be removed. Stored buffs retain all modifiers of the
    original buff.
