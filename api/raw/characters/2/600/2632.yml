special:
  name: Parental Fist
  description: Deals 200x character's ATK in [DEX] damage to one enemy. If your
    Captain is a Fighter or Powerhouse character, reduces Special Cooldown of
    Fighter and Powerhouses characters by 2 turns and reduces enemies' Barrier
    and Damage Nullification duration by 3 turns. If this character is a Sailor,
    swaps this unit with your captain for 2 turns.
  cooldown: 32
  maxLevel: 1
  stages:
    - description: Deals 50x character's ATK in [DEX] damage to one enemy. If your
        Captain is a Fighter or Powerhouse character, reduces Special Cooldown
        of Fighter and Powerhouses characters by 1 turn and reduces enemies'
        Barrier and Damage Nullification duration by 1 turn. If this character
        is a Sailor, swaps this unit with your captain for 1 turn.
      cooldown: 28
  notes: This is the same type of ability as raid boss Shiki's swap. You cannot
    use it if another effect swaps your captain. (Such as if Shiki swaps first)
