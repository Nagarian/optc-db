  description: Reduces Special Cooldown of Striker and Powerhouse characters by 2
    turns at the start of the fight boosts ATK of Striker and Powerhouse
    characters by 4x, their HP by 1.25x, and deals 400x character's ATK in [DEX]
    damage to all enemies at the end of each turn. At the start of the fight,
    this character activates their own special.
  notes: Preemptive Special Activation will not reset the special cooldown.
special:
  name: Boro Breath
  description: Deals 20% of enemies' current HP in damage to all enemies and deals
    400x character's ATK in [DEX] damage to all enemies at the end of each turn
    for 99+ turns. Applies a Continuous Effect that deals 20% of enemies'
    current HP in damage to all enemies at the start of every stage for 99+
    turns.
  cooldown: 22
  maxLevel: 6
  notes: The continuous special effect that triggers at the start of each stage
    will not stack with other continuous special effects.
