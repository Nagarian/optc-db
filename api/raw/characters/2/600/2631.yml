captain:
  name: ""
  description: Boosts ATK of all characters by 2.5x, but boosts ATK of this
    character by 1.25x, recovers 5x character's RCV in HP at the end of each
    turn and if you don't attack with her, reduces damage received by 15% for
    that turn.
special:
  name: A Glimpse of Poseidon's Power
  description: Changes all orbs, including [BLOCK] orbs, into [RAINBOW] orbs,
    recovers 125x character's RCV in HP and reduces RCV DOWN and No Healing
    duration by 15 turns.
  cooldown: 21
  maxLevel: 5
  stages:
    - description: Changes orbs, including [BLOCK] orbs, of adjacent characters into
        [RAINBOW] orbs, recovers 14x character's RCV in HP and reduces RCV DOWN
        and No Healing duration by 5 turns.
      cooldown: 13
  notes: Rainbow orbs are the beneficial form of [BLOCK] orbs. They can not be
    shuffled or swapped by you or your opponent. They count as beneficial orbs
    to any character. They do not count as [STR] orbs for Sakazuki but do act
    like Matching orbs for Black Clad Ace or Fujitora captain abilities.
sailor:
  - description: Changes all orbs into [RAINBOW] orbs at the start of the fight.
  - description: Boosts amount healed from [RCV] orbs by 150 each
