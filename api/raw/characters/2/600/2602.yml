  description: Boosts ATK of Striker, Cerebral and Free Spirit characters by 3.5x,
    recovers 5x character's RCV in HP at the end of each turn and protects from
    defeat as long as HP is above 50%.
special:
  name: Lovely Healing
  description: Changes all orbs, including [BLOCK] orbs, into Matching orbs,
    recovers 100x character's RCV in HP, reduces 2 selected debuffs duration by
    10 turns and becomes Shirahoshi & Mansherry for 1 turn.
  cooldown: 22
  maxLevel: 6
  notes: "The debuff reduction only works on debuffs whose icons are located in
    the bottom left of the adventure screen, above the HP bar. This DOES NOT
    include: Bind, Despair, Paralysis, Silence, Slot Bind, and Target Lock.
    Additionally, this debuff reduction will not trigger any enemy interupts,
    however the healing or orb manipulation of the special may still activate
    interupts."
