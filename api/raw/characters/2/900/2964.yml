captain:
  name: ""
  description: Boosts ATK of this character by 5x, boosts ATK of other [INT]
    characters by 4.25x, their HP by 1.5x, reduces RCV of all characters by 85%
    and reduces Special Cooldown of this character by 2 turns after each turn
    you take damage.
superSpecial:
  criteria: This character must be captain and Blackbeard's ATK after boosts
    should be greater than 500x his base ATK.
  description: Boosts base ATK of this character by 1000 for 1 turn, reduces all
    enemies' positive buffs duration by 1 turn and transforms all [INT]
    characters into Super [INT] characters.
  notes: "Positive Buffs include, but are not limited to: ATK UP, Any Variation of
    Debuff Immunity, Increased Defense, Percent Damage Reduction, Threshold
    Damage Reduction and Enrage. This list will be expanded if any specific
    exceptions are found."
special:
  name: Quake Strike of the New Emperor
  description: Deals 10% of enemies' current HP in True damage to one enemy,
    changes the orb of this character into a Matching orb, boosts ATK of this
    character by 2x-4x for 1 turn, and boosts Orb Effects of this character by
    2x-4x for 1 turn, depending on the number of times the character used their
    own special.
  cooldown: 15
  maxLevel: 6
  notes: "ATK and Orb boosts increase each time the character uses their own
    special. 1st time: 2x, 2nd time: 3x, 3rd time or more: 4x."
sailor:
  - description: Boosts base ATK of this character by 300 if this character is the
