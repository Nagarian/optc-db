    of the fight, boosts ATK of Powerhouse and Striker characters by 3.25x-4.5x
    depending on the crew's current HP, reduces damage received by 20%, reduces
    crew's RCV to 0.
  notes: >-
    `captainProportional : lower : 3.25 + 1.25 * (1 - (remaining HP) / (total
    HP)) : 3.25 : 4.5`  

