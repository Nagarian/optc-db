  description: Boosts ATK of [DEX] characters by 3x, boosts ATK of all other
    characters by 2.75x, boosts HP of all characters by 1.3x and deals 10% of
    enemies' current HP in damage to all enemies at the end of each turn.
    Recovers 50% of damage taken from enemies in the previous stage when
    entering a new stage. At the beginning of each Stage, increases the Attack
    Timer of all enemies by 1 turn.
superSpecial:
  criteria: This character must be captain and an active Support ability must have
    been activated by being inflicted by an enemy action.
  description: Reduces any damage received above 500 HP by ?% for 1 turn and
    transforms all [DEX] characters into Super [DEX] characters.
special:
  name: Strawman's Pursuit
  description: Deals 500x character's ATK in Typeless damage to one enemy, changes
    orbs of this and adjacent characters into Matching orbs and adds 20x the
    damage taken from enemies before the special is activated as Additional
    Typeless Damage for 3 turns.
  cooldown: 16
  maxLevel: 6
  notes: The amount of damage possible caps at 50,000 damage taken, so 1,000,000
    Additional Damage.
sailor:
  - description: Makes [STR], [QCK], [TND] and [RCV] orbs beneficial for this character
  - description: Reduces Paralysis and Silence duration completely on this character
