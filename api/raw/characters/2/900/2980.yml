captain:
  name: ""
  description: Boosts ATK of [DEX] characters by 4x, boosts ATK of all other
    characters by 3.75x, changes [TND] orbs into [BOMB] orbs, boosts chances of
    getting [TND] orbs and makes [BOMB] and [SUPERBOMB] orbs beneficial for all
    characters. If a [DEX] character has a [BOMB] or [SUPERBOMB] orb, boosts
    their ATK by 5x instead. [BOMB] and [SUPERBOMB] orbs will deal 0 damage to
    the crew.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Trafalgar D. Water Law, Killer, Basil Hawkins,
    Capone Bege, Jewelry Bonney, Scratchmen Apoo, X Drake or Urouge, excluding
    Support members."
  description: Deals 100x character's ATK in Typeless Fixed True damage to all
    enemies, changes all orbs, including [BLOCK] orbs, into [BOMB] orbs and
    transforms all [DEX] characters into Super [DEX] characters.
special:
  name: Captain's Steel Arm
  description: Changes [STR], [DEX], [BOMB] and [SUPERBOMB] orbs into [EMPTY]
    orbs, deals 500,000-3,000,000 Typeless damage to all enemies depending on
    number of slots emptied, changes [EMPTY] orbs into [SUPERBOMB] orbs and
    boosts ATK of [DEX] characters by 2.5x for 1 turn.
  cooldown: 18
  maxLevel: 6
  notes: |-
    0 slots emptied: 500,000 damage  
    1-6 slots emptied: deals 500,000 damage per slot emptied.
sailor:
  - description: Boosts base ATK, HP and RCV of [DEX] characters by 75
  - description: Makes [BOMB] and [SUPERBOMB] orbs beneficial for all characters
