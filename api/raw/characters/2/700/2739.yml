captain:
  name: ""
  description: Boosts ATK of Slasher, Striker, Driven, Cerebral and Powerhouse
    characters by 1.95x, reduces damage received by 20% and makes [STR], [PSY],
    [RCV] and [TND] orbs beneficial for all characters. Has a chance to delay
    all enemies by 1 turn based on damage dealt in previous turn.
  notes: >-
    The bonus is cumulative. Characters with 2 of the boosted classes get a
    1.95x or 2x squared ATK boost  

    Delay chance is based on damage dealt with normal attacks and does not stack with any other delay specials or effects  

    **Base Chances**  

    **100,000 damage or more:** 20% chance to delay  

    **500,000 damage or more:** 50% chance to delay  

    **1,000,000 damage or more:** 100% chance to delay  

    **2,000,000 damage or more:** 100% chance to delay ignoring Delay Debuff Protection  

    **Limit Break Chances**  

    **100,000 damage or more:** 20% chance to delay  

    **500,000 damage or more:** 50% chance to delay  

    **750,000 damage or more:** 100% chance to delay  

    **1,500,000 damage or more:** 100% chance to delay ignoring Delay Debuff Protection
special:
  name: Mochi Thrust
  description: Adds 100x character's ATK as Additional Typeless Damage for 1 turn,
    changes [BLOCK] orbs of all characters into Matching orbs and makes [STR],
    [DEX], [QCK], [PSY] and [INT] orbs beneficial for Slasher, Striker, Driven,
    Cerebral and Powerhouse characters for 2 turns. If during that turn you
    score 3 PERFECT hits, boosts ATK against delayed enemies by 2x for 1 turn.
  cooldown: 16
  maxLevel: 6
