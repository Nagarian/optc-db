captain:
  name: ""
  description: Boosts ATK of [DEX] and [STR] characters by 5x, by 5.25x if they
    have a [WANO] orb, boosts HP of [DEX] and [STR] characters by 1.25x,
    recovers 0.5x this character's RCV at the end of the turn for each time you
    hit a PERFECT and reduces damage received by 15%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: 6
    Slasher or Cerebral characters, excluding Support members."
  description: Reduces Special Cooldown of Slasher and Cerebral characters by 1
    turn, reduces enemies' Resilience duration by 7 turns and transforms all
    [DEX] characters into Super [DEX] characters.
special:
  name: Genuine Smile
  description: Changes all orbs, including [BLOCK] orbs, into [WANO] orbs, locks
    all orbs for 1 turn, reduces Bind, Despair and Chain Coefficient Reduction
    duration by 7 turns and recovers 50x character's RCV in HP.
  cooldown: 20
  maxLevel: 6
  stages:
    - description: Changes adjacent orbs, including [BLOCK] orbs, into [WANO] orbs,
        reduces Bind, Despair and Chain Coefficient Reduction duration by 3
        turns and recovers 20x character's RCV in HP.
      cooldown: 15
sailor:
  - description: Changes all orbs into [WANO] orbs at the start of the fight
  - description: If this character has a [WANO] orb and you attack with this
      character, reduces enemies' Slasher and Cerebral Resistance by -15% for 1
      turn.
