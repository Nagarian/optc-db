captain:
  name: ""
  description: Boosts ATK of Cerebral and Free Spirit characters by 5.25x, boosts
    HP of Cerebral and Free Spirit characters by 1.2x, reduces damage received
    by 10%, makes [TND] orbs beneficial for Cerebral and Free Spirit characters
    and reduces Paralysis duration by 10 turns. If this character has a [QCK],
    [TND] or [WANO] orb and you attack with this character, reduces the defense
    of all enemies by 100% for 1 turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Bepo,
    Shachi, Penguin, Jean Bart or Monkey D. Luffy, excluding Support members or
    your crew must have ATK UP applied."
  description: Changes the orb, including [BLOCK] orb, of this character into a
    [TND] orb, boosts ATK against enemies with reduced defense by 2.25x for 3
    turns and transforms all Cerebral characters into Super Cerebral characters.
special:
  name: Dragon-Piercing Gamma Knife
  description: Reduces Special Cooldown of all characters by 1 turn, increases
    Chain Tap Timing Bonus of Cerebral and Free Spirit characters by +0.2x-0.6x
    for 1 turn depending on Tap Timing, boosts ATK of Cerebral and Free Spirit
    characters by 2.75x for 1 turn and recovers 50x character's RCV in HP,
    allowing HP Overfill up to 2x MAX HP. If your crew has ATK UP, boosts Orb
    Effects of Cerebral and Free Spirit characters by 2.5x for 2 turns.
  cooldown: 19
  maxLevel: 6
