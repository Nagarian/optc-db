captain:
  name: ""
  description: Boosts ATK of [QCK] characters by 5x, boosts ATK of all other
    characters by 4x, boosts HP of all characters by 1.5x, boosts Color Affinity
    of [QCK] characters by 1.1x, reduces damage received by 10%, makes [QCK],
    [RCV] and [TND] orbs beneficial for all characters and boosts chance of
    getting [QCK] and [TND] orbs.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Ben Beckman, Lucky Roux, Yasopp, Rockstar and Uta, excluding
    Support members."
  description: Increases boost effects of Color Affinity buffs by +0.25x, changes
    all enemies into [STR] characters for 1 turn and transforms all [QCK]
    characters into Super [QCK] characters.
  notes: Enemy Type Change is a debuff.
special:
  name: Haki Slash
  description: Deals 10% of enemies' current HP in True damage to all enemies,
    changes all orbs, including [BLOCK] orbs, of left column characters into
    [QCK] orbs, changes all orbs, including [BLOCK] orbs, of right column
    characters into [TND] orbs and adds 1.4x to Chain multiplier for 1 turn. If
    your crew has 5 or more [QCK] characters, boosts Color Affinity of [QCK]
    characters by 2.75x for 1 turn; boosts Color Affinity of all characters by
    2.25x for 1 turn otherwise. If your crew has Chain Addition and Color
    Affinity at the time the special is activated, reduces enemies' Percent
    Damage Reduction and Threshold Damage Reduction duration by 7 turns and
    increases boost effects of Chain Addition buffs by +0.5x.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Boosts base ATK of all characters by 100
  - description: Makes [STR] orbs beneficial for [QCK] characters
support:
