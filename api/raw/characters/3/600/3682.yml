captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of [INT] and Cerebral characters by 5x, boosts HP
    of [INT] and Cerebral characters by 1.35x, makes [RCV] and [TND] orbs
    beneficial for [INT] and Cerebral characters, recovers 4,000 HP at the end
    of each turn, boosts EXP and amount of Beli received by 1.25x and guarantees
    duplicating all Cotton Candy drops upon completion of the island.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Nami, Usopp, Vinsmoke Sanji, Nico Robin, Franky,
    Brook, Jinbe, Bepo or Bartolomeo, excluding Support members."
  description: Reduces Special Cooldown of all characters by 1 turn, permanently
    boosts HP by a static 1.2x, recovers 30% of crew's MAX HP, allowing HP
    Overfill up to 2x MAX HP and transforms all [INT] characters into Super
    [INT] characters.
special:
  name: Cheering the Stage
  description: Recovers 50x character's RCV in HP, allowing HP Overfill up to 2x
    MAX HP, reduces Bind and Despair duration by 6 turns, reduces enemies'
    Cerebral Resistance by -50% for 1 turn and boosts Color Affinity of [INT]
    and Cerebral characters by 2.25x for 1 turn. If during that turn you score 3
    PERFECT hits, boosts Color Affinity of [INT] and Cerebral characters by 2.5x
    for 1 turn.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Makes [RCV] and [TND] orbs beneficial for [INT] characters
  - description: Recovers 800 HP at the end of each turn
