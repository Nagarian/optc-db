captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight and boosts HP of all characters by 1.5x. If there is a [STR],
    [DEX] and [QCK] character in your crew, boosts ATK of [STR], [DEX] and [QCK]
    characters by 4.5x. If there are no [PSY] or [INT] characters on your crew,
    boosts ATK of [STR], [DEX] and [QCK] characters by 5.4x instead and makes
    [RCV] and [TND] orbs beneficial for all characters.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kaido,
    King, Queen, Jack, Black Maria, Who's-Who, Page One and Ulti, excluding
    Support members."
  description: Changes the orb of this character into a [TND] orb, deals 80x
    character's ATK in Typeless damage to all enemies, reduces Special Cooldown
    of [STR], [DEX] and [QCK] characters by 1 turn and reduces enemies'
    Powerhouse Resistance by -50% for 1 turn and transforms all Powerhouse
    characters into Super Powerhouse characters.
special:
  name: Beatdown Horns
  description: Deals 100x character's ATK in [DEX] damage to all enemies, reduces
    damage received by 90% for 1 turn and boosts ATK of [STR], [DEX] and [QCK]
    characters by 2.5x for 1 turn. If this character is your Captain or
    Friend/Guest Captain or your Captain is a [STR] or [QCK] character, boosts
    base ATK of [STR], [DEX] and [QCK] characters by 1,250 for 3 turns, boosts
    base ATK of [STR], [DEX] and [QCK] characters by 1,000 for 1 turn otherwise.
  cooldown: 19
  maxLevel: 7
sailor:
  - description: If your Captain is a [STR] or [QCK] character, makes [DEX] and
      [STR] orbs beneficial for all characters
  - description: If your Captain is a [STR] or [QCK] character, reduces Burn
      duration by 2 turns
