captain:
  name: ""
  description: Reduces Special Cooldown of Striker and Driven characters by 3
    turns at the start of the fight, boosts ATK of Striker and Driven characters
    by 5.25x, boosts HP of Striker and Driven characters by 1.65x, makes [QCK],
    [INT] and [TND] orbs beneficial for Striker and Driven characters and
    reduces crew's current HP by 10% at the end of each turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Killer,
    Heat or Wire, excluding Support members or HP must be below 50%."
  description: Deals 100x character's ATK in Typeless True damage to all enemies,
    reduces Special Cooldown of Striker and Driven characters by 1 turn,
    increases boost effects of ATK UP buffs applied by Striker and Driven
    characters by 0.25x for 1 turn and transforms all Driven characters into
    Super Driven characters.
special:
  name: Punk Vice
  description: Deals 20% of enemies' current HP in True damage to all enemies,
    increases Chain Tap Timing Bonus of Striker and Driven characters by
    +0.2x-0.6x for 1 turn depending on Tap Timing, boosts ATK of Striker and
    Driven characters by 2.75x for 1 turn, changes [STR], [DEX], [QCK], [PSY],
    [INT] and [BLOCK] orbs of Striker and Driven characters into [TND] orbs and
    barriers Striker and Driven character's orbs for 1 PERFECT hit. If your crew
    has ATK UP, boosts Orb Effects of Striker and Driven characters by 2.5x for
    2 turns.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Makes [TND] orbs beneficial for Striker and Driven characters
  - description: Boosts base ATK, HP and RCV of Striker and Driven characters by 100
