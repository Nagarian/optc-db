captain:
  name: ""
  description: Boosts ATK of Free Spirit and Fighter characters by 5x, by 5.5x
    instead if they have a beneficial orb, boosts HP of Fighter and Free Spirit
    characters by 1.3x, boosts chances of getting [TND] orbs, makes [TND] orbs
    beneficial for all characters and increases duration of any ATK boosting
    buffs applied by Specials by 1 turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Roronoa
    Zoro, Nami, Usopp, Vinsmoke Sanji, Tony Tony Chopper, Nico Robin, Franky,
    Brook or Jinbe, excluding Support members."
  description: Reduces Special Cooldown of all characters by 1 turn, increases
    boost effects of Orb Amplification buffs by +0.25x, boosts base ATK of
    Fighter and Free Spirit characters by 1,000 for 1 turn and transforms all
    Free Spirit characters into Super Free Spirit characters.
special:
  name: Future King of Pirates and his Companions
  description: Reduces Special Cooldown of all characters by 1 turn, deals 200x
    character's ATK in [DEX] damage to all enemies, reduces Despair duration by
    20 turns, changes all orbs, including [BLOCK] orbs, into [TND] orbs and
    locks all orbs for 1 turn. If this character is the Captain or the Friend
    Captain, boosts Orb Effects of Fighter and Free Spirit characters by 3.25x
    for 1 turn, by 3x for 1 turn otherwise.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Makes [TND] orbs beneficial for all characters
  - description: Boosts base ATK of all characters by 100
support:
  type: descriptive
  criteria: Roronoa Zoro, Nami, Usopp, Vinsmoke Sanji, Tony Tony Chopper, Nico
    Robin, Franky, Jinbe and Brook
  levels:
    - Once per adventure, when the supported character uses their special,
      boosts base ATK of the supported character by 1.05x until the next stage.
    - Once per adventure, when the supported character uses their special,
      boosts base ATK of the supported character by 1.1x until the next stage.
    - Once per adventure, when the supported character uses their special,
      boosts base ATK of the supported character by 1.15x until the next stage.
    - Once per adventure, when the supported character uses their special,
      boosts base ATK of the supported character by 1.2x until the next stage.
    - Once per adventure, when the supported character uses their special,
      boosts base ATK of the supported character by 1.25x until the next stage.
