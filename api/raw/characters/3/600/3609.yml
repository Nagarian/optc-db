captain:
  name: ""
  description: Boosts ATK of Striker and Powerhouse characters by 5.25x, boosts HP
    of Striker and Powerhouse characters by 1.5x, boosts chances of getting
    [STR] and [TND] orbs and makes [STR] and [TND] orbs beneficial for Striker
    and Powerhouse characters. If this character has a [WANO] orb and you attack
    with this character, ignores Debuff Protection and inflicts all enemies with
    Increase Damage Taken by 1.5x for 1 turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: 6
    Striker characters or King, Queen, Jack, Sasaki, X Drake, Black Maria,
    Who's-Who, Page One, Ulti, or Charlotte Linlin (Big Mom), excluding Support
    members."
  description: Deals 200x character's ATK in Typeless damage to all enemies,
    changes all orbs of top row and middle row characters into [WANO] orbs,
    changes all orbs of bottom row characters into [TND] orbs and transforms all
    Striker characters into Super Striker characters.
special:
  name: Conquerer of Three Worlds Ragnaraku
  description: Deals 20% of enemies' current HP in damage to all enemies, changes
    [STR] orbs into [WANO] orbs for 2 turns, boosts ATK against enemies
    inflicted with Increase Damage Taken by 2x for 1 turn and boosts Orb Effects
    of Striker and Powerhouse characters by 2.75x for 1 turn.
  cooldown: 20
  maxLevel: 6
