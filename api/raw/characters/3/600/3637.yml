captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of Slasher and Powerhouse characters by 4.5x, by 5x
    instead if they have a beneficial orb, boosts HP of Slasher and Powerhouse
    characters by 1.3x, makes crew immune to Blow Away and makes [STR] and [DEX]
    orbs beneficial for Slasher and Powerhouse characters.
special:
  name: Giant Liquid Strike
  description: Deals 20% of enemies' current HP in True damage to all enemies,
    reduces enemies' Percent Damage Reduction duration by 6 turns and reduces
    Despair and ATK DOWN duration by 6 turns. If your Captain is a Powerhouse
    character, sets Chain Boundaries to 2.5x and 35.0x for 3 turns and increases
    duration of any base ATK boosting buffs by 2 turns.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: When any other Slasher or Powerhouse character uses a special,
      reduces special cooldown of this character by 1 turn
  - description: Makes [DEX] orbs beneficial for Slasher and Powerhouse characters
support:
  type: descriptive
  criteria: Charlotte Linlin (Big Mom), Charlotte Katakuri and Charlotte Cracker
  levels:
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV] and Badly Matching orbs of the
      suppported character into a [QCK] orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV], [TND] and Badly Matching orbs of the
      suppported character into a [QCK] orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV], [TND], [BOMB], [G] and Badly Matching
      orbs of the suppported character into a [QCK] orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV], [TND], [BOMB], [G], [EMPTY] and Badly
      Matching orbs of the suppported character into a [QCK] orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV], [TND], [BOMB], [G], [EMPTY], [BLOCK]
      and Badly Matching orbs of the suppported character into a [QCK] orb and
      reduces ATK DOWN duration by 2 turns.
