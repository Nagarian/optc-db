captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of [STR] and [INT] characters by 4.5x and makes
    [STR] and [INT] orbs beneficial for [STR] and [INT] characters. Deals
    0x-600x character's ATK in Typeless damage to one enemy at the end of each
    turn depending on how many PERFECTs scored that turn.
  notes: >-
    End of turn damage is based on how many PERFECTs you hit this turn: 0
    PERFECTs - 0x ATK; 1 PERFECT - 100x ATK; 2 PERFECTs - 200x ATK; 3 PERFECTs -
    300x ATK; 4 PERFECTs - 400x ATK; 5 PERFECTs - 500x ATK; 6 PERFECTs - 600x
    ATK  

    [LLB] End of turn damage is based on how many PERFECTs you hit this turn: 0 PERFECTs - 0x ATK; 1 PERFECT - 150x ATK; 2 PERFECTs - 250x ATK; 3 PERFECTs - 350x ATK; 4 PERFECTs - 500x ATK; 5 PERFECTs - 650x ATK; 6 PERFECTs - 800x ATK
special:
  name: Roiling Hound Blaze
  description: Deals 200x character's ATK in Typeless True damage to one enemy,
    reduces enemies' Increased Defense and Percent Damage Reduction duration by
    2 turns, changes all orbs, including [BLOCK] orbs, into Matching orbs and
    boosts Orb Effects of [STR] and [INT] characters by 2.25x for 1 turn. If you
    have used 20 or more [STR] or [INT] orbs in attacks at the time the special
    is activated, reduces Special Cooldown of this character by 12 turns.
  cooldown: 20
  maxLevel: 6
