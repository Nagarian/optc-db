captain:
  name: ""
  description: Reduces Special Cooldown of this character by 4 turns at the start
    of the fight, boosts ATK of [INT], Striker and Cerebral characters by 5.25x,
    boosts HP of [INT], Striker and Cerebral characters by 1.3x and reduces
    Paralysis duration by 10 turns and restores Special Cooldown of all
    characters by 10 turns when they are rewinded.
superSpecial:
  criteria: This character must be captain and your crew must have ATK UP and Orb Effect.
  description: Increases boost effects of ATK UP and Orb Amplification buffs
    applied by Striker and Cerebral characters by 0.25x for 3 turns, recovers
    30% of crew's MAX HP and transforms all Cerebral characters into Super
    Cerebral characters.
special:
  name: Joyous Song
  description: >-
    Applies a Turn Progress Effect for 3 turns that will apply the
    following effects:


    -   **Turn 1 (Activation):** Boosts ATK of Striker and Cerebral characters by 2.5x for 1 turn and boosts Orb Effects of Striker and Cerebral characters by 2x for 1 turn

    -   **Turn 2:** Boosts ATK of Striker and Cerebral characters by 2.75x for 1 turn and boosts Orb Effects of Striker and Cerebral characters by 2.25x for 1 turn

    -   **Turn 3:** Boosts ATK of Striker and Cerebral characters by 3x for 1 turn and boosts Orb Effects of Striker and Cerebral characters by 2.5x for 1 turn

    -   **On Effect Removal by Enemy:** Boosts ATK of Striker and Cerebral characters by 2.5x for 1 turn and boosts Orb Effects of Striker and Cerebral characters by 2.5x for 1 turn.


    If your crew has Turn Progress Effect when the special is activated, changes all orbs, including [BLOCK] orbs, into [INT] orbs, locks all orbs for 2 turns and adds 1.4x to Chain multiplier for 3 turns.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Makes [PSY] and [INT] orbs beneficial for Cerebral characters
  - description: Boosts base HP of Cerebral characters by 1.1x
support:
  type: descriptive
  criteria: "[INT] Cerebral characters"
  levels:
