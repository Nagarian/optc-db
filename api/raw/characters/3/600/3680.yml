      Effects of Cerebral characters by 1.3x for 1 turn.
    - Once per adventure, when the supported character uses their special,
      boosts ATK of Cerebral characters by 1.4x for 1 turn and boosts Orb
      Effects of Cerebral characters by 1.4x for 1 turn.
    - Once per adventure, when the supported character uses their special,
      boosts ATK of Cerebral characters by 1.5x for 1 turn and boosts Orb
      Effects of Cerebral characters by 1.5x for 1 turn.
