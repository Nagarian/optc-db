captain:
  name: ""
  description: "Boosts ATK of Driven and Powerhouse characters by 4.75x, by 5.25x
    instead if they have a beneficial orb, their HP by 1.5x and makes [INT] and
    [TND] orbs beneficial for Driven and Powerhouse characters. If a crew member
    uses a special with a base ATK UP or End of Turn Healing buff, replaces
    those buffs with an base ATK boost that will overwrite base ATK boosts in
    the same special: Boosts base ATK of Driven and Powerhouse characters by
    1,250 for 1 turn. If a crew member uses a special with a Percent Damage
    Reduction or Chain Addition buff, replaces those buffs with an Chain
    Addition boost that will overwrite Chain Addition boosts in the same
    special: Adds 1.4x to Chain multiplier for 1 turn."
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Jesus
    Burgess (Mr. Store), Shiryu, Van Ogre, Avalo Pizarro, Lafitte, Catarina
    Devon, San Juan Wolf, Vasco Shot or Doc Q, excluding Support members or your
    crew must have both a Chain Addition and Base ATK buff."
  description: Boosts ATK of Driven and Powerhouse characters by 2.25x for 1 turn,
    changes [STR], [DEX], [QCK], [PSY] and [INT] orbs into [TND] orbs and
    transforms all Powerhouse characters into Super Powerhouse characters.
special:
  name: Ground-Shaking Tremors
  description: Deals 20% of enemies' current HP in True damage to all enemies,
    reduces Bind duration by 10 turns. If during that turn you score 2 PERFECT
    hits, sets Chain Boundaries to 2.75x and 35.0x for 1 turn. If your Captain
    is a Driven or Powerhouse character, sets Chain Boundaries to 3.0x and 40.0x
    for 1 turn, sets Chain Boundaries to 2.5x and 35.0x for 1 turn otherwise.
  cooldown: 19
  maxLevel: 6
sailor:
  - description: Boosts base HP of Driven and Powerhouse characters by 200
  - description: When any other Driven or Powerhouse character uses a special,
      reduces special cooldown of this character by 1 turn
