captain:
  name: ""
  description: If there is a [STR], [DEX] and [QCK] character in your crew, boosts
    ATK of [STR], [DEX] and [QCK] characters by 5.25x, boosts HP and RCV of
    [STR], [DEX] and [QCK] by 1.2x, makes [PSY], [INT], [RCV] and [TND] orbs
    beneficial for all characters and reduces Paralysis duration by 10 turns.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kaido,
    King, Queen, Jack, Sasaki, Who's-Who, Page One and Ulti, excluding Support
    members."
  description: Changes the orb of this character into a [TND] orb, increases boost
    effects of Orb Amplification buffs to 3x and transforms all Powerhouse
    characters into Super Powerhouse characters.
special:
  name: Unavoidable Strikes
  description: Deals 10% of enemies' current HP in damage to all enemies, delays
    all enemies by 3 turns, changes [EMPTY], [BLOCK], [BOMB] and [G] orbs into
    Matching orbs and boosts Orb Effects of [STR], [DEX] and [QCK] characters by
    2.5x for 1 turn. If this character is your Captain or Friend/Guest Captain
    or your Captain is a [STR] or [DEX] character, boosts ATK against delayed
    enemies by 2.25x for 3 turns, by 2x for 1 turn otherwise.
  cooldown: 19
  maxLevel: 6
