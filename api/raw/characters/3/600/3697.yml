captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns at the start
    of the fight, boosts ATK of [QCK] and Shooter characters by 5x, by 5.25x
    instead if they have a beneficial orb and boosts HP of [QCK] and Shooter
    characters by 1.2x. When a Barrier Penetration Enabled character hits a
    PERFECT, reduces enemies' Increased Defense, Percent Damage Reduction and
    Threshold Damage Reduction duration by 1 turn.
  notes: You do not need to actively use Barrier Penetration to damage through a
    barrier in order to proc the Buff Reduction on PERFECT. The character only
    needs to fulfill the requirements to have Barrier Penetration active.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: 5
    Shooter characters, excluding Support members."
  description: Reduces enemies Increased Defense, Percent Damage Reduction and
    Threshold Damage Reduction duration by 2 turns, boosts ATK of Shooter
    characters by 2x for 2 turns and transforms all Shooter characters into
    Super Shooter characters.
special:
  name: Emotional Bullet
  description: Boosts Orb Effects of [QCK] and Shooter characters by 2.25x for 3
    turns and sets Chain Boundaries to 2.75x and 35.0x for 3 turns. If your crew
    has Orb Amplification, increases boost effects of Orb Amplification buffs by
    +0.3x. If your crew has Chain Lock, increases boost effects of Chain Lock
    buffs by +0.25x.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: If your Captain is a Shooter character, boosts base ATK, HP and RCV
