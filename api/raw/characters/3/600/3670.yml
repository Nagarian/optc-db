  description: Boosts ATK of [DEX] characters by 5.25x, boosts ATK of [PSY]
    characters by 5.4x, boosts HP of [DEX] and [PSY] characters by 1.25x,
    reduces damage received by 10% and makes [PSY] and [RCV] orbs beneficial for
    all characters. If this character has a [PSY], [RCV] or [WANO] orb and you
    attack with this character, increases boost effects of Color Affinity buffs
    by +0.25x.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Nami, Usopp, Tony Tony Chopper, Nico Robin, Franky, Brook and
    Jinbe, excluding Support members."
  description: Deals 100x character's ATK in Typeless True Fixed damage to all
    enemies, reduces Special Cooldown of [DEX] and [PSY] characters by 1 turn,
    adds 1.5x to Chain multiplier for 1 turn and transforms all [DEX] characters
    into Super [DEX] characters.
special:
  name: Sea-Splitting Blades and Legs
  description: Changes [STR], [DEX], [QCK], [PSY], [INT] and [BLOCK] orbs into
    [PSY] orbs, deals 10% of enemies' current HP in damage to all enemies and
    inflicts all enemies with Increase Damage Taken by 1.75x for 2 turns. If
    your crew has 6 [DEX] or [PSY] characters, boosts the Color Affinity of
    [DEX] and [PSY] characters by 2.5x for 1 turn, by 2.25x for 1 turn
    otherwise.
  cooldown: 20
  maxLevel: 6
sailor:
