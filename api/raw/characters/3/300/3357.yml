captain:
  name: ""
  description: If HP is above 99% at the start of the turn, boosts ATK of [INT]
    characters by 5x, by 4.5x otherwise, boosts ATK of all other characters by
    4x, boosts HP of all characters by 1.3x and allows HP Overfill up to 2x MAX
    HP. Once per adventure, if HP is below 30%, activates "Blue Flame Kick".
superSpecial:
  criteria: This character must be captain and HP must be below 50%.
  description: Changes all orbs into [INT] orbs, reduces RCV DOWN duration
    completely and transforms all [INT] characters into Super [INT] characters.
special:
  name: Blue Flame Kick
  description: Reduces Slot Barrier duration by 3 turns, reduces Paralysis and
    Silence duration by 7 turns and recovers 50x character's RCV in HP, allowing
    HP Overfill up to 2x MAX HP. If HP is below 50% at the time the special is
    activated, boosts the Color Affinity of [PSY], [INT] and Powerhouse
    characters by 2.5x for 1 turn, by 2x for 1 turn otherwise. If your crew has
    Color Affinity boost, adds 1.2x to Chain multiplier for 1 turn.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Boosts base ATK, HP and RCV of [INT] characters by 75
  - description: Reduces Silence duration completely on this character
