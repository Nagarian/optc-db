captain:
  name: ""
  description: Boosts ATK of this character by 5x, boosts ATK of all other
    characters by 4x and boosts HP of all characters by 1.2x. If HP is above 99%
    at the start of the turn, this character's own normal attacks count as Type
    Effective against all Types.
superSpecial:
  criteria: This character must be captain and your crew must have ATK UP.
  description: Deals 100x character's ATK in Typeless True damage to all enemies,
    reduces Special Cooldown of all characters by 1 turn and transforms all
    [PSY] characters into Super [PSY] characters.
special:
  name: Those Crossing A Thousand Seas
  description: Makes [STR], [DEX], [QCK], [PSY] and [INT] orbs beneficial for all
    characters for 1 turn, boosts ATK of all characters by 2.25x for 1 turn,
    boosts the color affinity of all characters by 1.75x for 1 turn, delays all
    enemies by 1 turn, reduces 1 selected debuff duration by 5 turns, reduces
    damage received by 70% for 1 turn, changes [BLOCK] orbs into Matching orbs,
    recovers 4,343 HP and reduces enemies' Increased Defense and Percent Damage
    Reduction duration by 5 turns.
  cooldown: 21
  maxLevel: 6
