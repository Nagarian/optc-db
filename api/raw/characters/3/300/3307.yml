captain:
  name: ""
  description: Boosts ATK of [INT] characters by 4.5x, by 5x instead if they have
    a [RCV] orb, boosts ATK of all other characters by 3.75x and makes [RCV]
    orbs beneficial for all characters. Characters who attack with a Type
    advantage will gain a [RCV] orb after attacking.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Trafalgar D. Water Law, Basil Hawkins, Killer,
    Urouge, Eustass Kid, Scratchmen Apoo, X Drake or Capone Bege, excluding
    Support members."
  description: Changes all orbs into [RCV] orbs, reduces Sailor Despair duration
    by 3 turns and reduces Special Cooldown of this character by 1 turn and
    transforms all [INT] characters into Super [INT] characters.
special:
  name: Age-Controlling Hand
  description: Reduces Slot Bind and Silence duration by 10 turns, reduces Special
    Cooldown of all characters by 1 turn, reduces the defense of all enemies by
    100% for 1 turn, changes [EMPTY], [BLOCK] and Badly Matching orbs into [RCV]
    orbs and boosts ATK of [INT] characters by 2.5x for 1 turn. Locks the chain
    multiplier at 3x-3.5x for 1 turn depending on how many [RCV] orbs used in
    normal attacks.
  cooldown: 19
  maxLevel: 6
  notes: |-
    **0-7 orbs consumed:** 3x chain lock  
    **8-14 orbs consumed:** 3.25x chain lock  
    **15+ orbs consumed:** 3.5x chain lock
sailor:
  - description: Restores Special Cooldown of this character by 10 turns when it is
      rewinded and reduces Silence duration by 10 turns on this character
  - description: Makes [RCV] orbs beneficial for all characters
support:
  type: descriptive
  criteria: Monkey D. Luffy, Roronoa Zoro, Trafalgar D. Water Law, Basil Hawkins,
    Killer, Urouge, Eustass Kid, Scratchmen Apoo, X Drake and Capone Bege
  levels:
    - Once per adventure, when you reach the final stage, changes the orb of the
      supported character into a [RCV] orb and makes [RCV] orbs beneficial for
      all characters for 1 turn.
    - Once per adventure, when you reach the final stage, changes the orb of the
      supported character into a [RCV] orb and makes [RCV] orbs beneficial for
      all characters for 1 turn.
    - Once per adventure, when you reach the final stage, changes the orb of the
      supported character into a [RCV] orb and makes [RCV] orbs beneficial for
      all characters for 1 turn.
    - Once per adventure, when you reach the final stage, changes the orb of the
      supported character into a [RCV] orb, reduces Silence duration by 1 turn
      on the supported character and makes [RCV] orbs beneficial for all
      characters for 1 turn.
    - Once per adventure, when you reach the final stage, changes the orb of the
      supported character into a [RCV] orb, reduces Silence duration by 2 turns
      on the supported character and makes [RCV] orbs beneficial for all
      characters for 1 turn.
