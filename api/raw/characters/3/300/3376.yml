captain:
  name: ""
  description: Boosts ATK of [QCK], Driven and Powerhouse characters by 5x, their
    HP by 1.2x and makes [QCK] and [INT] orbs beneficial for [QCK], Driven and
    Powerhouse characters and if you use "Pteranodon Raid" in this turn, deals
    500x character's ATK in [QCK] damage to all enemies at the end of the turn.
    Twice per an adventure, if a crew member uses an ability with ATK UP,
    activates "Pteranodon Raid" in the following turn.
superSpecial:
  criteria: This character must be captain and your crew must have ATK UP.
  description: Deals 75x character's ATK in Typeless damage to all enemies,
    changes all orbs into [QCK] orbs and transforms all [QCK] characters into
    Super [QCK] characters.
special:
  name: Pteranodon Raid
  description: Deals 20% of enemies' current HP in damage to all enemies, reduces
    Special Cooldown of all characters by 1 turn and boosts Orb Effects of
    [QCK], Driven and Powerhouse characters by 2.5x for 1 turn. After 1 turn,
    adds 1.1x to Chain multiplier for 1 turn.
  cooldown: 19
  maxLevel: 6
