captain:
  name: ""
  description: Boosts ATK of [PSY] characters by 4.5x, boosts ATK of all other
    characters by 4x, makes [TND] orbs beneficial for all characters and boosts
    chances of getting [TND] orbs. If a [PSY] character has a [PSY] or [TND]
    orb, boosts their ATK by 5x instead. If this character becomes your captain
    in the middle of an island, this character's own normal attacks count as
    Type Effective against all Types.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Vinsmoke Sanji, Monkey D. Luffy, Nami, Tony Tony Chopper, Brook, Jinbe or
    Carrot, excluding Support members."
  description: Boosts Chain Multiplier Growth Rate by 1.25x for 1 turn, locks all
    orbs for 1 turn and transforms all [PSY] characters into Super [PSY]
    characters.
special:
  name: Germa 66
  description: Changes all orbs, including [BLOCK] orbs, into [TND] orbs and
    boosts Orb Effects of [PSY] characters by 2.25x for 3 turns. If this
    character is a Sailor, swaps this unit with your captain for 3 turns.
  cooldown: 19
  maxLevel: 6
  stages:
    - description: Changes the orb of this character into a [TND] orb and boosts Orb
        Effects of [PSY] characters by 2x for 1 turn. If this character is a
        Sailor, swaps this unit with your captain for 1 turn.
      cooldown: 13
    - description: Changes all orbs into [TND] orbs and boosts Orb Effects of [PSY]
        characters by 2.25x for 2 turns. If this character is a Sailor, swaps
        this unit with your captain for 2 turns.
      cooldown: 16
sailor:
  - description: Makes [STR], [DEX], [QCK], [PSY] and [INT] orbs beneficial for this
      character
  - description: Makes [TND] orbs beneficial for all characters
support:
  type: descriptive
  criteria: Vinsmoke Sanji
  levels:
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes the orb of the supported character into a
      [TND] orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes all orbs into [TND] orbs.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes all orbs into [TND] orbs and makes [TND] orbs
      beneficial for all characters for 1 turn.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes all orbs into [TND] orbs and makes [PSY] and
      [TND] orbs beneficial for all characters for 1 turn.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes all orbs into [TND] orbs and makes [PSY],
      [RCV] and [TND] orbs beneficial for all characters for 1 turn.
