  description: Reduces Special Cooldown of this character by 3 turns at the start
    of the fight, boosts ATK of [STR], Striker and Driven characters by 5x and
    their HP by 1.3x. If HP is below 50% at the start of the turn, reduces
    damage received by 25%.
superSpecial:
  criteria: This character must be captain and this character's Special ability
    must be used 2 times.
  description: Changes all orbs into Matching orbs, reduces Burn duration by 3
    turns and transforms all [STR] characters into Super [STR] characters.
special:
  name: Trample-Down Steel Arm
  description: If HP is above 51% at the time the special is activated, reduces
    crew's current HP by 50% crew's MAX HP and advances Special Cooldown of this
    character to MAX. Deals 100x character's ATK in Typeless True damage to all
    enemies and boosts ATK of [STR], Striker and Driven characters by 2.5x for 1
    turn. If your crew has ATK UP, boosts Orb Effects of [STR], Striker and
    Driven characters by 2.5x for 1 turn. If your crew has ATK UP and Orb
    Amplification, boosts the Color Affinity of [STR], Striker and Driven
    characters by 2x for 1 turn.
  cooldown: 19
  maxLevel: 6
