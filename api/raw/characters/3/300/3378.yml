captain:
  name: ""
  description: Boosts ATK of [DEX], Driven and Powerhouse characters by 5x, their
    HP by 1.2x and makes [DEX] and [PSY] orbs beneficial for [DEX], Driven and
    Powerhouse characters and if you use "Crushing Brachio Bomber" in this turn,
    deals 500x character's ATK in [DEX] damage to all enemies at the end of the
    turn. Twice per an adventure, if a crew member uses an ability with Orb
    amplification, activates "Crushing Brachio Bomber" in the following turn.
superSpecial:
  criteria: This character must be captain and your crew must have Orb amplification.
  description: Deals 75x character's ATK in Typeless damage to all enemies,
    changes all orbs into [DEX] orbs and transforms all [DEX] characters into
    Super [DEX] characters.
special:
  name: Crushing Brachio Bomber
  description: Deals 20% of enemies' current HP in damage to all enemies, reduces
    Special Cooldown of all characters by 1 turn and boosts ATK of [DEX], Driven
    and Powerhouse characters by 2.5x for 1 turn. If during that turn you score
    3 PERFECT hits, sets Chain Boundaries to 2.5x and 35.0x for 1 turn.
  cooldown: 19
  maxLevel: 6
sailor:
