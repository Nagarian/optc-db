captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of all characters by 4.75x, their HP by 1.2x, makes
    [STR] orbs beneficial for all characters and recovers 1x this character's
    RCV at the end of the turn for each time you hit a PERFECT.
superSpecial:
  criteria: This character must be captain and another crew member must activate a
    Special Ability.
  description: Reduces Special Cooldown of this character by 5 turns, boosts the
    Color Affinity of [STR] characters by 2x for 1 turn and transforms all [STR]
    characters into Super [STR] characters.
special:
  name: Tale Woven Together for Twenty Years
  description: Apply Toki-Toki state to 2 characters for 2 turns. After Toki-Toki
    state expires, boosts ATK of selected characters by 3.5x for 1 turn and
    boosts Orb Effects of selected characters by 3.5x for 1 turn.
  cooldown: 19
  maxLevel: 6
  notes: "Toki-Toki state makes certain members of your crew immune to debuffs
    including, but not limited to: Bind, Despair, Silence, Slot Bind, Paralysis,
    Special Rewind, Captain Swap and Blow Away, including self-inflicted
    debuffs."
sailor:
  - description: Boosts base ATK, HP and RCV of all characters by 100
  - description: Restores Special Cooldown of this character by 2 turns when it is
      rewinded and reduces Silence duration by 5 turns on this character
