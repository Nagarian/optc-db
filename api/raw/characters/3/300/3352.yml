  criteria: "[QCK] characters"
  levels:
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [RCV] and [G] orb of the supported character
      into a Matching orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [BOMB], [RCV] and [G] orb of the supported
      character into a Matching orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes [EMPTY], [BOMB], [RCV] and [G] orb of the
      supported character into a Matching orb.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
