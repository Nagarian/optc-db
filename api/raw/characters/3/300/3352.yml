special:
  name: Kuja Return
  description: Reduces enemies' Increased Defense and Percent Damage Reduction
    duration by 5 turns, boosts ATK of Shooter and Free Spirit characters by 2x
    for 1 turn and boosts ATK against delayed enemies by 1.5x for 1 turn. If HP
    is above 25,000 at the time the special is activated, delays all enemies by
    1 turn. If HP is above 50,000 at the time the special is activated, ignores
    Delay Debuff Protection and delays all enemies by 1 turn.
  cooldown: 28
  maxLevel: 15
