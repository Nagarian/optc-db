      effects including: Increased Defense, Percent Damage Reduction, Threshold
      Damage Reduction, Damage Nullification, Barriers and Resilience, but will
      be rounded down. This means that if the enemy HP is 1 and the enemy has
      Resilience, Law will add 0 damage, and will be unable to kill through
      Resilience. This damage is static and is unaffected by Increase Damage
      Taken debuffs or any other buffs and is calculated when Law's attack
      starts, not at the start of the attack chain."
