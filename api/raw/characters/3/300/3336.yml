  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Basil Hawkins, Killer, Urouge, Eustass Kid,
    Scratchmen Apoo, X Drake, Capone Bege or Jewelry Bonney, excluding Support
    members."
