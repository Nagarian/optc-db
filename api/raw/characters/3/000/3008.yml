  description: Boosts ATK of Cost 40 or less characters by 4.5x, boosts ATK of all
    other characters by 3x, boosts HP of all characters by 1.2x and makes [QCK]
    and [INT] orbs beneficial for all characters.
special:
  name: Toy Revenge
  description: Select up to 5 characters to become Toy Bears for 3 turns.
  cooldown: 20
  maxLevel: 6
  notes: Toy Bears have 40 cost and 2500 base ATK. Toy Bears will automatically
    attack after Sugar attacks. Sugar and Toy Bears will ignore barriers and
    gain +0.7x chain addition on HOBBY-HOBBY hit, instead of +0.3x for PERFECTs.
    Toy Bears are immune to some debuffs including, but not limited to, Bind,
    Stun, Paralysis and Burn. Auto-attacking Toy Bears will hit a HOBBY-HOBBY
    tap timing, which is similar to a PERFECT.
