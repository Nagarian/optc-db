captain:
  name: ""
  description: Boosts ATK of [PSY] characters by 4x-5x depending on the amount
    healed in the last turn, boosts ATK of all other characters by 3.75x, boosts
    chances of getting [RCV] orbs and makes [RCV] orbs beneficial for all
    characters.
  notes: The range of ATK boost is from 4x to 5x. The exact boost is calculated as
    4 + (HP recovered in the previous turn) \* (1/7000) and maxes at 7k HP
    healed. This ignores your max HP, so it doesn't stop counting if you
    over-heal.
superSpecial:
  criteria: This character must be captain and your team must have an End of Turn
    Healing buff applied.
  description: Changes all orbs, including [BLOCK] orbs, into [PSY] orbs, boosts
    ATK of [PSY] characters by 2.5x for 1 turn and transforms all [PSY]
    characters into Super [PSY] characters.
special:
  name: Sweet Breeze of the Mero Mero Blowing Across the Beach
  description: Reduces Special Cooldown of all characters by 2 turns, inflicts
    Melo-Melo to all enemies for 15 hits and recovers 11x character's RCV in HP
    at the end of each turn for 5 turns.
  cooldown: 19
  maxLevel: 6
  notes: Melo-Melo state prevents enemies from attacking until 15 combo hits are
    dealt to that character.
sailor:
  - description: Makes [PSY] orbs beneficial for all characters
  - description: Restores Special Cooldown of this character completely when it is rewinded
