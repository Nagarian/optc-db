  description: Boosts ATK of [STR] characters by 4.25x, boosts ATK of all other
    characters by 3.75x, boosts HP of all characters by 1.3x and reduces Despair
    duration by 10 turns. If you defeated an enemy last turn, boosts ATK of
    [STR] characters by 5x instead.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Charlotte Linlin (Big Mom), Charlotte Perospero, Charlotte Daifuku,
    Charlotte Oven, Charlotte Amande, Charlotte Brûlée, Charlotte Montd'Or,
    Charlotte Galette, Charlotte Bavarois, Charlotte Pudding, or Charlotte
    Flampe, excluding Support members."
  description: Deals 100x character's ATK in Typeless True damage to all enemies,
    reduces Special Cooldown of [STR] characters by 1 turn and transforms all
    [STR] characters into Super [STR] characters.
special:
  name: Sweet 3 Consecutive Strike
  description: Adds 1.1x to Chain multiplier for 1 turn, boosts ATK of [STR]
    characters by 2x for 1 turn and boosts the Color Affinity of [STR]
    characters by 2x for 1 turn
  cooldown: 20
  maxLevel: 6
