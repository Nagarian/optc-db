special:
  name: Emergency Operation Injection Shot
  description: Changes [EMPTY], [BLOCK], [BOMB], [RCV], [G], Badly Matching orbs
    into Matching orbs and changes the orb of this character into a Matching
    orb. If your Captain is a Fighter, Slasher, Striker or Shooter character,
    boosts Orb Effects of all characters by 2.25x for 2 turns. If your Captain
    is a Free Spirit, Driven, Cerebral or Powerhouse character, sets Chain
    Boundaries to 2.5x and 35.0x for 2 turns.
  cooldown: 19
  maxLevel: 6
