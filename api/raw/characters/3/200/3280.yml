  description: "Boosts ATK of Driven and Powerhouse characters by 5x, their HP by
    1.75x, reduces Special Cooldown of this character by 2 turns after each turn
    you take damage and deals 10% of enemies' current HP in True damage,
    ignoring Normal Attack Only, to all enemies at the start of every stage. If
    a crew member uses a special with a Percent Damage Reduction, Threshold
    Damage Reduction or Damage Nullification buff, replaces those buffs with an
    ATK boost that will overwrite ATK boosts in the same special: Boosts ATK of
    Driven and Powerhouse characters by 2x for 1 turn."
special:
  name: Tremendous Dismay of Darkness and Earthquakes
  description: Adds 1.0x to Chain multiplier for 1 turn and becomes Blackbeard,
    Two Overwhelming Abilities for 3-8 turns depending on the total Damage Taken
    before the special is activated. If your Captain is a Powerhouse or Driven
    character, increases duration of any ATK boosting buffs and Orb
    Amplification buffs by 1 turn.
  cooldown: 19
  maxLevel: 6
  notes: |-
    0 damage: 3 turns  
    ? damage: 4 turns  
    ? damage: 5 turns  
    ? damage: 6 turns  
    ? damage: 7 turns  
    50,000 damage: 8 turns
