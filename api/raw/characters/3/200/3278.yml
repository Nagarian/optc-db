captain:
  name: ""
  description: If HP is above 70% at the start of the turn, boosts ATK of [QCK]
    characters by 5x, by 4.5x otherwise, boosts HP of all characters by 1.3x,
    boosts ATK of all other characters by 4x and reduces Paralysis duration by
    10 turns. Recovers 25% of damage taken from enemies in the previous stage
    when entering a new stage.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Hannyabal, Shiryu, Domino, Sadie, Saldeath, Boa Hancock, Sengoku, Sakazuki
    (Akainu), Kuzan (Aokiji) or Borsalino (Kizaru), excluding Support members."
  description: Removes Poison duration completely, recovers 25% of damage taken
    from enemies on the stage when entering a new stage for 1 stage and
    transforms all [QCK] characters into Super [QCK] characters.
special:
  name: "Poison Punishment: Poison Spider Cloud"
  description: Deals 10% of enemies' current HP in True damage to all enemies,
    reduces Bind and Burn duration by 3 turns, boosts the Color Affinity of all
    characters by 2x for 1 turn and inflicts Toxic to all enemies. If enemies
    are inflicted with Toxic or Poison upon activation of the special, boosts
    ATK of all characters by 2.5x for 1 turn.
  cooldown: 20
  maxLevel: 6
  notes: "`toxic : 50x : 2x : 3,000,000`"
sailor:
  - description: Reduces Paralysis duration completely on this character
  - description: When any other [QCK] character uses a special, reduces special
      cooldown of this character by 3 turns
