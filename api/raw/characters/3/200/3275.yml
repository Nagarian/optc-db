captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns at the start
    of the fight, boosts ATK of all characters by 3.5x and recovers 0.5x this
    character's RCV at the end of the turn for each time you hit a PERFECT. If
    your crew has 4 or more characters of the same Type, boosts ATK of the
    Dominant Type characters by 4x, boosts the Color Affinity of the Dominant
    Type characters by 1.1x.
special:
  name: "Swinging Downward: Lighting Blast"
  description: Deals 150,000 Fixed damage to all enemies and reduces Special
    Cooldown of all characters by 1 turn. If your crew has 4 or more characters
    of the same Type, boosts the Color Affinity of Dominant Type characters by
    1.75x for 1 turn. If HP is above 99% at the time the special is activated,
    removes enemies' Defense Reduction Debuff Protection duration completely,
    reduces the defense of all enemies by 100% for 2 turns and boosts ATK
    against enemies with reduced defense by 2x for 2 turns. Otherwise, recovers
    50% of crew's MAX HP, reduces the defense of all enemies by 100% for 1 turn
    and boosts ATK against enemies with reduced defense by 2x for 1 turn.
  cooldown: 20
  maxLevel: 6
