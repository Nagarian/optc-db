special:
  name: Crash Pretzel
  description: Deals 15% of enemies' current HP in damage to one enemy, changes
    [EMPTY], [BLOCK], [BOMB], [RCV] and [G] orbs into Matching orbs and changes
    the orb of this character into a Matching orb. If your Captain is a Fighter,
    Slasher, Shooter or Striker character, adds 1.1x to Chain multiplier for 2
    turns. If your Captain is a Free Spirit, Cerebral, Powerhouse or Driven
    character, boosts the Color Affinity of Free Spirit, Cerebral, Powerhouse
    and Driven characters by 2x for 2 turns.
  cooldown: 23
  maxLevel: 6
sailor:
  - description: When any other Powerhouse or Slasher character uses a special,
      reduces special cooldown of this character by 1 turn
  - description: Boosts base ATK, HP and RCV of Slasher and Powerhouse characters by 100
support:
  type: descriptive
  criteria: Charlotte Katakuri and Charlotte Smoothie
  levels:
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 1 turn and adds 0.3x to Chain
      multiplier for 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 1 turn and adds 0.4x to Chain
      multiplier for 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 2 turns and adds 0.4x to Chain
      multiplier for 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 2 turns and adds 0.5x to Chain
      multiplier for 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 3 turns and adds 0.7x to Chain
      multiplier for 1 turn.
