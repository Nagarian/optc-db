captain:
  name: ""
  description: Boosts ATK of [DEX] characters by 5x, by 4.5x otherwise, their HP
    by 1.5x, boosts ATK of all other characters by 4x and reduces Silence
    duration by 10 turns. Deals 20% of enemies' current HP in damage to all
    enemies at the start of every stage if total Damage Taken is 20,000 or more
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kozuki
    Hiyori (Komurasaki), Toko, Monkey D. Luffy, Nami, Usopp, Vinsmoke Sanji,
    Tony Tony Chopper, Nico Robin, Franky or Brook, excluding Support members."
  description: Deals 75x character's ATK in Typeless damage to all enemies, boosts
    the Color Affinity of [DEX] characters by 2x for 1 turn and transforms all
    [DEX] characters into Super [DEX] characters.
special:
  name: "Rend: Purgatory Onigiri"
  description: Reduces Special Cooldown of all characters by 2 turns, makes own
    attacks ignore damage reducing Barriers and Buffs, deals 100x character's
    ATK in Typeless Fixed True damage to all enemies and boosts Orb Effects of
    [DEX] characters by 2.5x-2.75x for 1 turn, based on total damage taken.
  cooldown: 20
  maxLevel: 6
  notes: |-
    0-19,999 Damage Taken: 2.5x orb boost  
    20,000+ Damage Taken: 2.75x orb boost
