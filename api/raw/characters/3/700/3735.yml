captain:
  name: ""
  description: Boosts ATK of [QCK], Striker and Cerebral characters by 4.5x, by
    5.25x instead if they have a beneficial orb, boosts HP of [QCK], Striker and
    Cerebral characters by 1.3x and reduces damage received by 10%. Has a chance
    to delay all enemies by 1 turn based on damage dealt in previous turn. At
    the start of the fight, locks all orbs for 10 turns.
  notes: >-
    **100,000 damage or more:** 20% chance to delay  

    **500,000 damage or more:** 50% chance to delay  

    **1,000,000 damage or more:** 100% chance to delay  

    **2,000,000 damage or more:** 100% chance to delay ignoring Delay Debuff Protection
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Smoker,
    Tashigi, Monkey D. Garp, Sengoku and Zephyr (Z), excluding Support members
    or your crew must have both a Orb Amplification and ATK buff."
  description: Changes [BLOCK] orbs into Matching orbs, boosts ATK against delayed
    enemies by 2x for 2 turns and transforms all [QCK] characters into Super
    [QCK] characters.
special:
  name: Kimono Sleeve Cage Lockdown
  description: Reduces enemies' Increased Defense duration by 6 turns, reduces ATK
    DOWN duration by 6 turns, reduces damage received by 80% for 1 turn and
    boosts Orb Effects of [QCK], Striker and Cerebral characters by 2.75x for 1
    turn. If your crew has Orb Amplification when the special is activated,
    boosts ATK of Striker and Cerebral characters by 2.25x for 1 turn and boosts
    base ATK of [QCK] characters by 1,000 for 1 turn.
  cooldown: 19
  maxLevel: 6
sailor:
  - description: Makes [DEX] orbs beneficial for all characters.
  - description: Boosts base ATK, HP and RCV of [QCK] characters by 75.
support:
  type: descriptive
