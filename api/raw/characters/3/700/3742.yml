special:
  name: Night of the Jack O' Flame Emperor
  description: Deals 200x character's ATK in [INT] damage to all enemies, reduces
    Bind duration by 10 turns and boosts ATK of [INT], Fighter and Shooter
    characters by 2.5x for 1 turn. If your crew has ATK UP, boosts Color
    Affinity of [INT], Fighter and Shooter characters by 2.25x for 1 turn. If
    your crew has 6 characters with [TND] orbs, increases or decreases boost
    effects of Chain Lock and Chain Boundary buffs to 3.75x.
  cooldown: 18
  maxLevel: 6
  notes: The upper and lower values of Chain Lock, Chain Limit and Chain Boundary
    buffs will be changed to 3.75x.
