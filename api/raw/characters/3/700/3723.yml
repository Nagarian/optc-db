    - Once per adventure, when the supported character uses their special,
      boosts ATK of supported character by 1.45x for 1 turn and boosts Orb
      Effects of the supported character by 1.45x for 1 turn.
    - Once per adventure, when the supported character uses their special,
      boosts ATK of supported character by 1.6x for 1 turn and boosts Orb
      Effects of the supported character by 1.6x for 1 turn.
    - Once per adventure, when the supported character uses their special,
      boosts ATK of supported character by 1.75x for 1 turn and boosts Orb
      Effects of the supported character by 1.75x for 1 turn.
