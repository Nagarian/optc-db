captain:
  name: ""
  description: Boosts ATK of all characters by 4.5x, boosts HP of all characters
    by 1.5x and makes [PSY], [TND] and Badly Matching orbs benedicial for all
    characters. If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
    your crew, boosts ATK of all characters by 5.5x instead and reduces damage
    received by 10%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Sakazuki (Akainu), Kuzan (Aokiji), Borsalino (Kizaru), Issho (Fujitora),
    Monkey D. Garp, Tsuru, Smoker, Tashigi, Hina and Coby, excluding Support
    members."
  description: Boosts base ATK of all characters by 1,250 for 1 turn and
    transforms all [PSY] characters into Super [PSY] characters.
special:
  name: Golden Shining Strike
  description: "If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
    your crew, select 1 character and: boosts ATK of selected characters by 4x
    for 1 turn, boosts Orb Effects of selected characters by 4x for 1 turn,
    changes orb of selected character into a Matching orb and changes all other
    orbs into [TND] orbs. If your crew has 4 or more [PSY] characters, select 1
    character and: boosts ATK of selected characters by 3.5x for 1 turn and
    boosts Orb Effects of selected characters by 3.5x for 1 turn."
  cooldown: 18
  maxLevel: 6
sailor:
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, if this character has a [PSY] or [TND] orb and you attack with
      this character, reduces enemies' [STR], [DEX], [QCK] and [INT] Resistance
      by -15% for 1 turn.
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, makes [PSY], [TND] and [RCV] orbs beneficial for all
      characters.
support:
  type: descriptive
  criteria: Monkey D. Garp, Sakazuki (Akainu), Kuzan (Aokiji), Borsalino (Kizaru)
    and Issho (Fujitora)
  levels:
    - Once per adventure, when the supported character uses their special,
      boosts ATK of supported character by 1.15x for 1 turn and boosts Orb
      Effects of the supported character by 1.15x for 1 turn.
    - Once per adventure, when the supported character uses their special,
      boosts ATK of supported character by 1.3x for 1 turn and boosts Orb
