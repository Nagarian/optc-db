captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of [INT] and Cerebral characters by 5x, by 5.25x
    instead if they have an [EMPTY] orb, boosts HP of [INT] and Cerebral
    characters by 1.3x and reduces Despair duration by 10 turns.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: 5
    Cerebral characters, excluding Support members or this character must have
    an [EMPTY] orb."
  description: Recovers 25% of crew's MAX HP, allowing HP Overfill up to 2x MAX HP
    and reduces Paralysis and ATK DOWN duration by 3 turns and transforms all
    Cerebral characters into Super Cerebral characters.
special:
  name: Moonlight Sparkles
  description: Boosts ATK of Cerebral characters by 2.75x for 1 turnm changes all
    orbs into [EMPTY] orbs, makes all orbs change into [EMPTY] orbs for all
    characters for 3 turns and increases Orb Effects of [EMPTY] orbs to 2.25x
    for 3 turns.
  cooldown: 18
  maxLevel: 6
sailor:
  - description: Boosts base ATK, HP and RCV of all characters by 75
  - description: Reduces Blindness duration by 10 turns
