superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Portgas D. Ace, Koala, Rebecca, Emporio Ivankov, Inazuma,
    Lindbergh, Belo Betty, Karasu, Morley or Bartholomew Kuma, excluding Support
    members."
  description: Inflicts all enemies with Burn that will deal 100x enemies' ATK in
    damage for 2 turns, boosts Chain Multiplier Growth Rate by 1.25x for 1 turn,
    adds 150x character's ATK as Additional Typeless Damage for 1 turn and
    transforms all [PSY] characters into Super [PSY] characters.
special:
  name: Impassioned Flame Dragon King
  description: Deals 10% of enemies' current HP in damage to all enemies and
    boosts the Color Affinity of [STR] and [PSY] characters by 2.25x for 1 turn.
    If during that turn you score 3 PERFECT hits, boosts the Color Affinity of
    [STR] and [PSY] characters by 2.25x for 1 turn. After 1 turn, adds 1.1x to
    Chain multiplier for 1 turn.
  cooldown: 18
  maxLevel: 6
