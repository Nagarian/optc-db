    captain for 1 turn. If there is a [STR], [DEX], [QCK], [PSY] and [INT]
    character in your crew, increases boost effects of Chain Addition buffs by
    +0.3x, including effects activated in the same Special.
  cooldown: 19
  maxLevel: 7
