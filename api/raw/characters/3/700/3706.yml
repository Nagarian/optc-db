captain:
  name: ""
  description: Boosts ATK of [PSY], Fighter and Free Spirit characters by 5x. If
    you use "Ending King Cobra" in this turn boosts ATK of [PSY], Fighter and
    Free Spirit characters by 5.5x instead. If your crew has Roronoa Zoro,
    Sanji, Usopp, Nami, Tony Tony Chopper, Nico Robin, Franky, Brook, Jinbe or
    Shanks as a Sailor and they use their special, reduces Silence duration
    completely on this character and advances Special Cooldown of this character
    to MAX.
  notes: Cooldown Reduction and Paralysis Reduction on special effect is limited
    to 3 times per turn and 5 times per adventure. Effect only procs from
    crewmates who belong to those Character Families, not Captains or
    Friend/Guest Captains.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Roronoa
    Zoro, Vinsmoke Sanji, Usopp, Nami, Tony Tony Chopper, Nico Robin, Franky,
    Brook or Jinbe or Shanks, excluding Support members. 2 of Roronoa Zoro,
    Vinsmoke Sanji, Usopp, Nami, Tony Tony Chopper, Nico Robin, Franky, Brook or
    Jinbe are required or alternatively, 1 of Shanks is required."
  description: Deals 120x character's ATK in Typeless True damage to one enemy,
    reduces Special Cooldown of middle and bottom row characters by 2 turns and
    transforms all [PSY] characters into Super [PSY] characters.
special:
  name: Ending King Cobra
  description: Deals 200x character's ATK in Typeless True damage to one enemy,
    and boosts ATK of [PSY], Fighter and Free Spirit characters by 3.25x for 1
    turn. If your crew has ATK UP, boosts Orb Effects of [PSY], Fighter and Free
    Spirit characters by 2.75x for 1 turn. If your crew has ATK UP and Orb
    Amplification, changes all orbs, including [BLOCK] orbs, into Matching orbs
    and increases boost effects of ATK UP and Orb Amplification buffs by +0.25x.
    If this character has used their special 4 times or more and your crew does
    not have ATK UP, boosts Orb Effects of [PSY], Fighter and Free Spirit
    characters by 2.75x for 1 turn.
  cooldown: 19
  maxLevel: 6
sailor:
  - description: Reduces Paralysis duration completely on this character and
      restores Special Cooldown of this character completely when it is rewinded
  - description: After each turn you take damage, reduces special cooldown of this
