captain:
  name: ""
  description: Boosts HP of all characters by 1.5x and makes [STR] and [TND] orbs
    beneficial for all characters. If there is a [STR], [DEX], [QCK], [PSY] and
    [INT] character in your crew, boosts ATK of all characters by 4x. If this
    character becomes your captain in the middle of an island, further boosts
    ATK of all characters by 1.35x and reduces damage received by 10%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Sengoku, Kuzan (Aokiji), Borsalino (Kizaru), Issho (Fujitora) and Monkey D.
    Garp, excluding Support members."
  description: Boosts Color Affinity of this character by 2.5x for 1 turn,
    optionally removes Captain Swap duration completely and transforms all [STR]
    characters into Super [STR] characters.
special:
  name: Boiling Fist Strike
  description: Reduces Bind duration by 5 turns, reduces enemies' Increased
    Defense duration by 5 turns and boosts ATK against enemies inflicted with
    Burn by 1.75x for 1 turn. If this character is a Sailor, optionally swaps
    this unit with your captain for 1 turn. If there is a [STR], [DEX], [QCK],
    [PSY] and [INT] character in your crew, inflicts all enemies with Burn that
    will deal 100x enemies' ATK in damage for 1 turn that will ignore debuff
    protection after each turn you take damage, inflicts all enemies with Burn
    that will deal 100x enemies' ATK in damage for 1 turn otherwise.
  cooldown: 19
  maxLevel: 7
sailor:
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, makes [STR] orbs beneficial for all characters.
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, if this character has a [TND] orb and you attack with this
      character, reduces enemies' [STR], [QCK], [PSY] and [INT] Resistance by
      -10% for 1 turn.
