special:
  name: Marksmanship of Father and Son
  description: Boosts base ATK of Shooter and Free Spirit characters by 1,250 for
    1 turn, boosts ATK against delayed enemies by 2.25x for 1 turn and becomes
    Usopp & Yasopp for 3 turns. If enemies are delayed at the time the special
    was activated, increases duration of any delay debuffs by 1 turn. If your
    Captain is a Shooter or Free Spirit character, ignores Debuff Protection and
    delays all enemies by 1 turn; delays all enemies by 1 turn otherwise.
  cooldown: 20
  maxLevel: 6
