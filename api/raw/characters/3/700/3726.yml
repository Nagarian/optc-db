    ATK of all characters by 1.35x and reduces damage received by 10%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Sengoku, Kuzan (Aokiji), Borsalino (Kizaru), Issho (Fujitora) and Monkey D.
    Garp, excluding Support members."
  description: Boosts Color Affinity of this character by 2.5x for 1 turn,
    optionally removes Captain Swap duration completely and transforms all [QCK]
    characters into Super [QCK] characters.
special:
  name: Impaling Partisan
  description: Reduces ATK DOWN and Silence duration by 5 turns and reduces
    enemies' Threshold Damage Reduction duration by 5 turns. If this character
    is a Sailor, optionally swaps this unit with your captain for 1 turn. If
    there is a [STR], [DEX], [QCK], [PSY] and [INT] character in your crew,
    increases boost effects of ATK UP and Orb Amplification buffs by +0.25x.
  cooldown: 19
  maxLevel: 7
sailor:
  - description: Reduces Silence duration by 5 turns on this character.
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, if this character has a [TND] orb and you attack with this
      character, reduces enemies' [STR], [DEX], [PSY] and [INT] Resistance by
      -10% for 1 turn.
