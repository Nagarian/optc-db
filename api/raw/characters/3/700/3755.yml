captain:
  name: ""
  description: Boosts ATK of Slasher and Free Spirit characters by 5.25x, by 5.4x
    instead if they have a beneficial orb, boosts HP of Slasher and Free Spirit
    characters by 1.2x and reduces damage received by 10%. If this character has
    a [TND] or [WANO] orb and you attack with this character, increases boost
    effects of Chain Addition buffs by +0.25x.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Vinsmoke Sanji, Nami, Usopp, Tony Tony Chopper, Nico Robin, Brook,
    Franky, Jinbe, Kozuki Hiyori and Yamato, excluding Support members or crew
    must have Color Affinity and Orb Amplification."
  description: Deals 75x character's ATK in Typeless damage to all enemies, boosts
    ATK of Slasher and Free Spirit characters by 2.5x for 1 turn and transforms
    all Slasher characters into Super Slasher characters.
special:
  name: "Demon Aura Nine-Sword Style: Ashura, Blades Drawn Dead Man's Game"
  description: Reduces crew's current HP by 20%, deals 1,000,000 Fixed True
    damage, ignoring Normal Attack Only, to all enemies, reduces enemies'
    Percent Damage Reduction and Threshold Damage Reduction duration by 6 turns
    and increases Chain Tap Timing Bonus of Slasher and Free Spirit characters
    by +0.2x-0.6x for 1 turn depending on Tap Timing. If your Captain's orb is
    [TND] or [WANO], boosts Chain Multiplier Growth Rate by 1.5x for 1 turn.
  cooldown: 20
  maxLevel: 6
