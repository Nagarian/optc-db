captain:
  name: ""
  description: "Boosts ATK of Driven and Powerhouse characters by 4.5x, boosts HP
    of Driven and Powerhouse characters by 1.75x, increases damage received by
    1.5x, reduces Special Cooldown of this character by 3 turns after each turn
    you take damage and allows HP Overfill up to 2x MAX HP. If total Damage
    Taken is 50,000 or more, boosts ATK of Driven and Powerhouse characters by
    5.25x instead, recovers 2,000 HP at the end of each turn, reduces damage
    received by 10% and removes the following effect from this character's
    Captain Ability: increases damage received by 1.5x."
special:
  name: Inescapable Eight-Headed Assault
  description: Reduces Special Cooldown of all characters by 1 turn, deals 100x
    character's ATK in Typeless damage to all enemies, boosts Orb Effects of
    Driven and Powerhouse characters by 2.25x-2.5x for 1 turn, based on total
    damage taken and boosts Color Affinity of Driven and Powerhouse characters
    by 2.25x-2.5x for 1 turn, based on total damage taken. If your Captain is a
    Driven or Powerhouse character, increases boost effects of Increase Damage
    Taken debuffs by +0.3x. If the special is activated with more than 70%
    health remaining, protects from defeat for 2 turns if HP is above 70%.
  cooldown: 20
  maxLevel: 6
  notes: |-
    0-49,999 Damage Taken: 2.25x orb/affinity boost  
    50,000+ Damage Taken: 2.5x orb/affinity boost.
sailor:
  - description: When any other Driven or Powerhouse character uses a special,
      reduces special cooldown of this character by 1 turn.
  - description: Makes [QCK] and [RCV] orbs beneficial for Driven and Powerhouse characters.
