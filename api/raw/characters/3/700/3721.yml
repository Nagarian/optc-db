captain:
  name: ""
  description: 'Reduces Special Cooldown of this character by 4 turns at the start
    of the fight, boosts ATK of [INT], Driven and Powerhouse characters by 5.25x
    and boosts HP of [INT], Driven and Powerhouse characters by 1.3x. If you use
    "Resonating Tot Musica: Finale" on this character, boosts ATK of [INT],
    Driven and Powerhouse characters by 5.5x for 3 turns instead. If there is
    only 1 enemy on the stage, reduces damage received by 40%.'
superSpecial:
  criteria: This character must be captain and your crew must have Orb Effect and
    Color Affinity.
  description: Increases boost effects of Orb Amplification and Color Affinity
    buffs applied by Driven and Powerhouse characters by 0.25x for 3 turns,
    changes all orbs of top and bottom row characters into Matching orbs and
    transforms all Driven characters into Super Driven characters.
special:
  name: "Resonating Tot Musica: Finale"
  description: >-
    Applies a Turn Progress Effect for 3 turns that will apply the
    following effects:


    -   **Start of Each Turn:** Reduces crew's current HP by 70% at the start of every turn

    -   **Turn 1 (Activation):** Boosts Orb Effects of Driven and Powerhouse characters by 2.5x for 1 turn and boosts Color Affinity of Driven and Powerhouse characters by 2.25x for 1 turn

    -   **Turn 2:** Boosts Orb Effects of Driven and Powerhouse characters by 2.75x for 1 turn and boosts Color Affinity of Driven and Powerhouse characters by 2.5x for 1 turn

    -   **Turn 3:** Boosts Orb Effects of Driven and Powerhouse characters by 3x for 1 turn and boosts Color Affinity of Driven and Powerhouse characters by 2.75x for 1 turn

    -   **On Effect Removal by Enemy:** Boosts Orb Effects of Driven and Powerhouse characters by 2.75x for 1 turn and boosts Color Affinity of Driven and Powerhouse characters by 2.5x for 1 turn.

    -   **Effect Removal Condition & Effect:** If your HP is below 70% at the end of your turn, removes Turn Progress Effect and binds themselves for 5 turns.


    If your crew has the same Turn Progress Effect when the special is activated, changes Effect Removal Condition & Effect to: If your HP is below 70% at the end of your turn, removes Turn Progress Effect and binds themselves for 5 turns; and changes the Start of Each Turn effect to: Reduces crew's current HP by 30% at the start of every turn. If your crew has Turn Progress Effect when the special is activated, increases duration of any ATK boosting buffs buffs by 2 turns, locks all orbs for 2 turns and adds 1.4x to Chain multiplier for 3 turns.
  cooldown: 20
  maxLevel: 6
