captain:
  name: ""
  description: Reduces Special Cooldown of Slasher characters by 2 turns, boosts
    ATK of Slasher characters by 5x, by 5.25x instead if they have a beneficial
    orb, boosts HP of Slasher characters by 1.25x, makes [RCV] and [TND] orbs
    beneficial for Slasher characters and reduces ATK DOWN duration by 10 turns.
    If this character has a [WANO] orb and you attack with this character,
    reduces enemies' Slasher Resistance by -10% for 1 turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kozuki
    Oden, Kozuki Hiyori, Kozuki Momonosuke, Cat Viper, Kawamatsu, Kikunojo,
    Raizo and Izo, excluding Support members."
  description: Deals 100x character's ATK in Typeless damage to all enemies,
    changes all orbs of top and bottom row characters into [WANO] orbs, changes
    all orbs of middle row characters into [TND] orbs and transforms all Slasher
    characters into Super Slasher characters.
special:
  name: "Inherited Oden Two-Sword Style: Paradise Totsuka"
  description: "Reduces enemies' Damage Nullification duration by 5 turns, changes
    all orbs, including [BLOCK] orbs, into Matching orbs and Boost ATK of [STR],
    Slasher and Free Spirit characters by 3x for 2 turns. If \"Inherited Oden
    Two-Sword Style: Paradise Totsuka\" or \"Oden Two-Sword Style: Paradise
    Totsuka\" was used in the same turn when special is activated, deals
    1,000,000 Fixed True damage, ignoring Normal Attack Only, to all enemies,
    increases boost effects of ATK UP and Orb Amplification buffs by +0.25x and
    increases duration of any ATK boosting buffs and Orb Amplification buffs by
    1 turn, including effects activated in the same Special."
  cooldown: 21
  maxLevel: 6
sailor:
  - description: When any other Slasher character uses a special, reduces special
      cooldown of this character by 2 turns
  - description: Boosts base ATK, HP and RCV of Slasher characters by 150
