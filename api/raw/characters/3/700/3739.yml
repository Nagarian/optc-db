captain:
  name: ""
  description: Boosts ATK of this character by 5x, boosts ATK of other [STR] and
    [INT] characters by 4.5x, boosts HP of [STR] and [INT] characters by 1.75x,
    makes [STR] and [INT] orbs beneficial for [STR] and [INT] characters,
    reduces Paralysis and Silence duration completely on this character and
    reduces Special Cooldown of this character by 2 turns after each turn you
    take damage.
superSpecial:
  criteria: This character must be captain and Blackbeard's ATK after boosts
    should be greater than 500x his base ATK.
  description: Boosts base ATK of this character by 1,250 for 1 turn, reduces all
    enemies' positive buffs duration by 1 turn and transforms all [INT]
    characters into Super [INT] characters.
  notes: "Positive Buffs include, but are not limited to: ATK UP, Any Variation of
    Debuff Immunity, Increased Defense, Percent Damage Reduction, Threshold
    Damage Reduction and Enrage. This list will be expanded if any specific
    exceptions are found."
special:
  name: Groud Breaking Shockwave
  description: Deals 10% of enemies' current HP in True damage to one enemy,
    reduces enemies' Threshold Damage Reduction duration by 5 turns, changes the
    orb, including [BLOCK] orbs, of this character into a Matching orb, boosts
    ATK of this character by 3x-4x for 1 turn, and boosts Orb Effects of this
    character by 3x-4x for 1 turn, depending on the number of times the
    character used their own special.
  cooldown: 15
  maxLevel: 6
  notes: "ATK and Orb boosts increase each time the character uses their own
    special. 1st time: 3/3.5x, 2nd time: 3.5/3.75x, 3rd time or more: 4x."
sailor:
  - description: Boosts base ATK of this character by 300 if this character is the
      last in the chain to attack
  - description: After each turn you take damage, reduces special cooldown of this
      character by 1 turn
