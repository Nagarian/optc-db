captain:
  name: ""
  description: Boosts HP of all characters by 1.5x and makes [DEX] and [TND] orbs
    beneficial for all characters. If there is a [STR], [DEX], [QCK], [PSY] and
    [INT] character in your crew, boosts ATK of all characters by 4x. If this
    character becomes your captain in the middle of an island, further boosts
    ATK of all characters by 1.35x and reduces damage received by 10%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Sengoku, Sakazuki (Akainu), Kuzan (Aokiji), Issho (Fujitora) and Monkey D.
    Garp, excluding Support members."
  description: Boosts Color Affinity of this character by 2.5x for 1 turn,
    optionally removes Captain Swap duration completely and transforms all [DEX]
    characters into Super [DEX] characters.
special:
  name: Lightspeed Kick
  description: Reduces Special Cooldown of all characters by 1 turn and reduces
    Burn and Paralysis duration by 5 turns. If this character is a Sailor,
    optionally swaps this unit with your captain for 1 turn. If there is a
    [STR], [DEX], [QCK], [PSY] and [INT] character in your crew, sets Chain
    Boundaries to 2.5x and 10.0x for 1 turn, locks the chain multiplier at 3.25x
    for 1 turn otherwise.
  cooldown: 17
  maxLevel: 7
sailor:
  - description: Restores Special Cooldown of this character by 2 turns when it is rewinded.
  - description: If there is a [STR], [DEX], [QCK], [PSY] and [INT] character in
      your crew, if this character has a [TND] orb and you attack with this
      character, reduces enemies' [STR], [QCK], [PSY] and [INT] Resistance by
      -10% for 1 turn.
