captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns at the start
    of the fight. Boosts ATK of Fighter, Slasher, Striker, Shooter and Cerebral
    characters by 4x, and if this character becomes your captain in the middle
    of an island, boosts ATK of Fighter, Slasher, Striker, Shooter and Cerebral
    characters by 4.5x instead. For 12 turns at the start of the fight, boosts
    chances of getting Matching orbs and attacks will ignore damage reducing
    Barriers and Buffs.
  notes: Attacks are still affected by DEF value. DEF boost buffs (Blue shield)
    still reduce your damage and you can not kill through Resilience, but Damage
    Negating (Yellow shield), % Damage Reduction (Rainbow shield), Barriers and
    Threshold Damage Reduction are ignored. Enemy attacks will go through YOUR
    defensive buffs.
