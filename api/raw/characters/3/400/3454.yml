captain:
  name: ""
  description: Boosts ATK of [INT], Shooter and Free Spirit characters by 4x and
    their HP by 1.3x. If enemies are inflicted with Negative, boosts ATK against
    enemies inflicted with Negative by 1.3x, boosts ATK against delayed enemies,
    enemies with reduced defense and Poisoned enemies by 1.25x otherwise.
superSpecial:
  criteria: This character must be captain and a special ability must be used 2 times.
  description: Ignores debuff protection and inflicts enemies with Negative for 10
    turns, changes [STR], [DEX], [QCK], [PSY] and [INT] orbs into Matching orbs
    and transforms all [INT] characters into Super [INT] characters.
  notes: Negative reduces the ATK and DEF of enemies by 20%. More info about how
    ATK reduction is calculated will be updated here soon.
special:
  name: Ghost Dance Night Party
  description: Changes Badly Matching, [EMPTY], [BLOCK], [BOMB], [RCV], [TND] and
    [G] orbs into Matching orbs, boosts ATK against delayed enemies, enemies
    inflicted with Negative, enemies with reduced defense, Poisoned enemies,
    Strongly Poisoned enemies and enemies inflicted with Toxic by 2x for 3 turns
    and locks the chain multiplier at 3.25x for 3 turns. If HP is below 80% at
    the time the special is activated, ignores debuff protection and inflicts
    enemies with Negative for 1 turn. If your crew has Chain Lock, increases
    boost effects of Chain Lock buffs/debuffs by +0.5x and increases duration of
    any Chain Multiplier Limit, Chain Lock, or Chain Boundary debuffs by 1 turn.
  cooldown: 19
  maxLevel: 6
