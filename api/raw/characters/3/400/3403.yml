captain:
  name: ""
  description: Boosts ATK of [INT], Cerebral and Powerhouse characters by 5x and
    their HP by 1.2x. If a crew member uses a special that inflicts Poison,
    Strong Poison or Toxic, inflict enemies with Poison Pink. If your crew is
    inflicted with Poison, Strong Poison or Toxic, activates "Lustrous Devilish
    Woman" in the following turn.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: 6
    Powerhouse or Cerebral characters, excluding Support members."
  description: Boosts Orb Effects of [INT], Cerebral and Powerhouse characters by
    2x for 1 turn and transforms all [INT] characters into Super [INT]
    characters.
special:
  name: Lustrous Devilish Woman
  description: Boosts ATK of [INT], Cerebral and Powerhouse characters by 2.25x
    for 3 turns, and removes Paralysis and Poison duration completely. If
    enemies are inflicted with Poison, Strong Poison, Toxic or Poison Pink,
    poison deals 30% of enemies' current HP in damage to all enemies and removes
    enemies' Poison duration completely. Otherwise, inflicts enemies with Poison
    Pink.
  cooldown: 20
  maxLevel: 6
  notes: >-
    Poison HP Cut deals damage in the same way as other poisons.  

    Poison Pink deals 20% of enemies' current HP in damage at the end of each turn and recovers 20% crew's MAX HP at the end of each turn. Poison Pink is derivative of Normal Poison, so it fulfills Poison Status ATK Boosts and is affected by Poison Debuff Immunity.
sailor:
  - description: Boosts base ATK, HP and RCV of Cerebral and Powerhouse characters by 75
  - description: Makes [PSY] orbs beneficial for all characters
support:
  type: descriptive
  criteria: Cerebral characters
  levels:
    - Once per adventure, when the supported character uses an Orb Converting or
      Orb Randomizing special, boosts ATK of Cerebral characters by 1.5x for 1
      turn.
    - Once per adventure, when the supported character uses an Orb Converting or
      Orb Randomizing special, boosts ATK of Cerebral characters by 1.55x for 1
