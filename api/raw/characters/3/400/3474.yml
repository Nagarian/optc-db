      Orb Randomizing special, boosts ATK of Powerhouse characters by 1.2x for 1
      turn.
    - Once per adventure, when the supported character uses an Orb Converting or
      Orb Randomizing special, boosts ATK of Powerhouse characters by 1.3x for 1
      turn.
    - Once per adventure, when the supported character uses an Orb Converting or
