captain:
  name: ""
  description: Boosts ATK of Powerhouse characters by 5x, boosts ATK of all other
    characters by 3.75x otherwise, boosts HP of all characters by 1.3x, boosts
    chances of getting Matching orbs and recovers 50% of damage taken from
    enemies in the previous stage when entering a new stage.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Charlotte Linlin (Big Mom), Charlotte Cracker, Charlotte Smoothie,
    Charlotte Perospero, Charlotte Daifuku, Charlotte Oven, Charlotte Amande,
    Charlotte Opera, Charlotte Brûlée, Charlotte Montd'Or, Charlotte Galette,
    Charlotte Bavarois, Charlotte Pudding or Charlotte Flampe, excluding Support
    members or any character's Special abilities are used 4 times."
  description: Increases duration of any Orb Amplification buffs by 1 turn,
    changes all orbs, including [BLOCK] orbs, into Matching orbs and transforms
    all Powerhouse characters into Super Powerhouse characters.
special:
  name: "Zangiri Mochi: Chop, Slice, Donut"
  description: Deals 10% of enemies' current HP in damage to all enemies, boosts
    base ATK of Powerhouse characters by 1000 for 1 turn and boosts Orb Effects
    of Powerhouse characters by 2.25x-2.75x for 1 turn, based on total damage
    taken. If your crew has Orb Amplification, boosts ATK of Powerhouse
    characters by 2.5x for 1 turn.
  cooldown: 20
  maxLevel: 6
  notes: |-
    0-24,999 Damage Taken: 2.25x orb boost  
    25,000-49,999 Damage Taken: 2.5x orb boost  
    50,000+ Damage Taken: 2.75x orb boost
sailor:
  - description: Boosts base ATK of Powerhouse characters by 125
  - description: If your Captain is a Powerhouse character, boosts base HP of
      Powerhouse characters by 1.1x
support:
  type: descriptive
  criteria: Charlotte Linlin (Big Mom), Charlotte Cracker, Charlotte Smoothie,
    Charlotte Perospero, Charlotte Daifuku and Charlotte Oven
  levels:
