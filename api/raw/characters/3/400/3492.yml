  description: Boosts ATK of Shooter, Cerebral and Free Spirit characters by
    4.25x, their HP by 1.3x, boosts Shooter, Cerebral and Free Spirit
    characters' ATK against delayed enemies by 1.2x and has a chance to delay
    all enemies by 1 turn based on damage dealt in previous turn. At the
    beginning of each Stage, increases the Attack Timer of all enemies by 1
    turn.
