    Nami & Usopp for 3 turns. If your crew has Delay Status ATK Boost, increases
    boost effects of Delay Status ATK Boost buffs by +0.3x.
  cooldown: 20
  maxLevel: 6
  notes: Paralysis has a 75% chance to not reduce enemy Attack Timer.
