captain:
  name: ""
  description: Boosts ATK of Driven characters by 5x, boosts ATK of all other
    characters by 3.75x otherwise, boosts HP of all characters by 1.3x, makes
    [DEX] and [QCK] orbs beneficial for Driven characters and reduces Silence
    duration by 10 turns.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Trafalgar D. Water Law, Diamante, Pica, Trebol, Vergo, Sugar,
    Kaido or Caesar Clown, excluding Support members or an active Support
    ability must have been activated by being inflicted by an enemy action."
  description: Deals 150x character's ATK in Typeless damage to all enemies,
    reduces Special Cooldown of Driven characters by 1 turn and transforms all
    Driven characters into Super Driven characters.
special:
  name: "God Thread: Divine Execution"
  description: Deals 300x character's ATK in Typeless damage to all enemies and
    changes all orbs, including [BLOCK] orbs, into Matching orbs. If your crew
    has ATK UP and Orb Amplification, boosts base ATK of Driven characters by
    1000 for 1 turn and adds 1.4x to Chain multiplier for 1 turn. Otherwise,
    boosts ATK of Driven characters by 2.25x for 1 turn, boosts Orb Effects of
    Driven characters by 2.25x for 1 turn and recovers 30% of crew's MAX HP.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Boosts base ATK of Driven characters by 125
  - description: When any other Driven character uses a special, reduces special
