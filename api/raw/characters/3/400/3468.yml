special:
  name: Princess Dancing in the Moonlit Night
  description: Displays the status of all enemies for 99 turns, reduces Special
    Cooldown of Cerebral and Free Spirit characters by 1 turn, reduces Silence
    duration by 4 turns and reduces enemies' Resilience duration by 5 turns. If
    enemies have Delay Debuff Protection or All Debuff Protection at the time
    the special was activated, boosts Orb Effects of Cerebral and Free Spirit
    characters by 2.25x for 1 turn, by 2x for 2 turns and delays all enemies by
    1 turn otherwise.
  cooldown: 19
  maxLevel: 6
