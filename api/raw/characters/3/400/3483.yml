captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of Cerebral characters by 5x, boosts ATK of all
    other characters by 3.75x otherwise and boosts HP of all characters by 1.3x.
    If HP is above 70% at the start of the stage, deals 10% of enemies' current
    HP in damage to all enemies at the start of every stage. If HP is above 70%
    at the start of the turn, Cerebral characters who attack with a Type
    advantage will gain a matching orb after attacking. If HP is below 50% at
    the start of the turn, recovers 2,000 HP at the end of each turn and reduces
    damage received by 20%.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Nefertari Vivi, Nico Robin, Daz Bones (Mr. 1), Zala (Miss
    Doublefinger), Bentham (Mr. 2, Bon Clay), Galdino (Mr. 3), Marianne (Miss
    Goldenweek), Babe (Mr. 4), Drophy (Miss Merry Christmas), Gem (Mr. 5) or
    Mikita (Miss Valentine), excluding Support members or HP must be below 50%."
  description: Deals 10% of enemies' current HP in damage to all enemies, changes
    [EMPTY], [BLOCK], [BOMB], [RCV] and [G] orbs into Matching orbs, removes HP
    conditions from this character's Abilities and transforms all Cerebral
    characters into Super Cerebral characters.
  notes: The HP condition removal applies to, but is not limited to, Captain and
    Special abilities but does not affect Potential abilities. This effect can
    be cleared by enemy buff clearing effects.
special:
  name: "Drastic Measures: Desert la Spada"
  description: Reduces Special Cooldown of Cerebral characters by 1 turn and
    boosts ATK of Cerebral characters by 2.5x for 1 turn. If HP is below 50% or
    when this character's Special Counter is 1 at the time the special is
    activated, sets Chain Boundaries to 3.0x and 40.0x for 3 turns, sets Chain
    Boundaries to 2.5x and 35.0x for 2 turns otherwise.
  cooldown: 20
  maxLevel: 6
  notes: Special Counter counts the amount of times that the character's special
    has been used in the adventure. This count can not be reset by Accumulated
    Value Clearing Enemy Effects.
sailor:
  - description: Restores Special Cooldown of this character by 2 turns when it is rewinded
  - description: Makes [DEX] orbs beneficial for Cerebral characters
support:
  type: descriptive
  criteria: Nico Robin and Daz Bones (Mr. 1)
  levels:
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 1 turn.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 2 turns.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 3 turns.
    - Once per adventure, when an enemy inflicts you with Chain Coefficient
      Reduction or Chain Multiplier Limit, reduces crew's Chain Multiplier Limit
      and Chain Coefficient Reduction duration by 3 turns and sets Chain
      Boundaries to 2.0x and 10.0x for 1 turn.
