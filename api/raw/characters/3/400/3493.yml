captain:
  name: ""
  description: Boosts ATK of Shooter, Cerebral and Free Spirit characters by
    4.25x, their HP by 1.3x, boosts Shooter, Cerebral and Free Spirit
    characters' ATK against delayed enemies by 1.2x and has a chance to delay
    all enemies by 1 turn based on damage dealt in previous turn. At the
    beginning of each Stage, increases the Attack Timer of all enemies by 1
    turn.
  notes: >-
    Delay chance is based on damage dealt with normal attacks and does not
    stack with any other delay specials or effects  

    **Base Chances**  

    **100,000 damage or more:** 20% chance to delay  

    **1,000,000 damage or more:** 50% chance to delay  

    **3,000,000 damage or more:** 100% chance to delay  

    **5,000,000 damage or more:** 100% chance to delay ignoring Delay Debuff Protection
special:
  name: Encounter to Stop the Chase
  description: Paralyzes (75%) all enemies for 5 turns, delays all enemies by 2
    turns, reduces Paralysis and Silence duration by 6 turns, boosts the Color
    Affinity of Shooter and Cerebral characters by 2.25x for 1 turn and becomes
    Nami & Usopp for 3 turns. If your crew has Delay Status ATK Boost, increases
    boost effects of Delay Status ATK Boost buffs by +0.3x.
  cooldown: 20
  maxLevel: 6
  notes: Paralysis has a 75% chance to not reduce enemy Attack Timer.
