captain:
  name: ""
  description: Boosts ATK of Driven and Powerhouse characters by 4.75x, by 5x
    instead if they have a beneficial orb, and makes [DEX], [QCK], [RCV] and
    [TND] orbs beneficial for all characters and deals 500x character's ATK in
    character's Type damage to all enemies at the end of each turn. If there is
    a Powerful Enemy, reduces damage received by 30%
special:
  name: No Rest for the Wicked
  description: Deals 300x character's ATK in Typeless damage to all enemies,
    changes all orbs into Matching orbs, removes Target Lock duration completely
    and becomes Ulti & Page One for 3 turns. If your Captain is a Powerhouse or
    Driven character, marks all enemies with 10,000,000 or more MAX HP as a
    Powerful Enemy and boosts ATK against Powerful Enemies by 2.25x for 1 turn.
  cooldown: 20
  maxLevel: 6
  notes: Powerful Enemy marker is not a debuff, so it bypasses debuff protection.
