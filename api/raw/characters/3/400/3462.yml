captain:
  name: ""
  description: Boosts ATK of [DEX], Fighter and Free Spirit characters by 4.5x, by
    5x instead if they have a beneficial orb, their RCV by 1.5x, makes [STR] and
    [QCK] orbs beneficial for [DEX], Fighter and Free Spirit characters, reduces
    damage received by 20% and restores Special Cooldown of all characters by 10
    turns when they are rewinded.
superSpecial:
  criteria: This character must be captain and the crew must consist of 6 Fighter
    or Free Spirit characters, excluding Support members.
  description: Permanently boosts HP by a static 1.2x, recovers 30% of crew's MAX
    HP, allowing HP Overfill up to 2x MAX HP and transforms all [DEX] characters
    into Super [DEX] characters.
special:
  name: Sanctions Against Uninvited Guests
  description: Reduces Counter-Heal duration by 10 turns and recovers 30,000 HP,
    allowing HP Overfill up to 2x MAX HP. If HP is above 99% at the time the
    special is activated, boosts the Color Affinity of [DEX], Fighter and Free
    Spirit characters by 2.5x for 1 turn, by 2.25x for 1 turn otherwise. If MAX
    HP is below 40,000 at the time the special is activated, permanently boosts
    HP by a static 1.3x.
  cooldown: 19
  maxLevel: 6
  notes: Static HP Boost is calculated at time of activation and does not change
    with changes to team composition.
