captain:
  name: ""
  description: Nullifies Remove Beneficial Effects and Remove Accumulated Value
    effects once per adventure. Boosts ATK of all characters by 4.5x and their
    HP by 1.3x and removes Despair duration completely. If you use "Divine
    Departure" on this Roger boosts ATK of all characters by 5x for 3 turns
    instead.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kozuki
    Oden, Silvers Rayleigh, Edward Newgate (Whitebeard), Crocus, Shanks, Buggy,
    Inuarashi, Nekomamushi and Portgas D. Ace, excluding Support members."
  description: Changes all orbs, including [BLOCK] orbs, into Matching orbs, locks
    all orbs for 1 turn and transforms all [PSY] characters into Super [PSY]
    characters.
special:
  name: Divine Departure
  description: Deals 1,000,000 Fixed True damage, ignoring Normal Attack Only, to
    all enemies and boosts ATK of all characters by 2x-3x for 1 turn depending
    on the amount of normal attack damage dealt before this special was
    activated. If this character is your Captain/Friend Captain, increases
    duration of any Orb Amplification buffs by 1 turn.
  cooldown: 19
  maxLevel: 6
  notes: |-
    0-1,499,999 damage: 2x ATK boost  
    1,500,000-2,999,999 damage: 2.5x ATK boost  
    3,000,000+ damage: 3x ATK boost
