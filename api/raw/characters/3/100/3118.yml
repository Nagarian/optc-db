captain:
  name: ""
  description: Boosts ATK of [INT] characters by 4x-5x based on the timing of the
    attack of the previous unit in the chain, boosts ATK of all other characters
    by 3.75x, boosts HP of all characters by 1.3x and recovers 0.5x this
    character's RCV at the end of the turn for each time you hit a PERFECT.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Dracule Mihawk, Ben Beckman, Yasopp or Lucky Roux, excluding
    Support members."
  description: Changes [BLOCK], [RCV], [TND], [BOMB] and [EMPTY] orbs into
    Matching orbs, reduces the defense of all enemies by 100% for 3 turns and
    transforms all [INT] characters into Super [INT] characters.
special:
  name: A Flash of Moonlight
  description: Boosts the Color Affinity of Slasher and Cerebral characters by 2x
    for 3 turns. If your crew has 4 or more [INT] characters, adds 1.0x to Chain
    multiplier for 3 turns.
  cooldown: 19
  maxLevel: 6
sailor:
  - description: Boosts base ATK, HP and RCV of all characters by 100
  - description: Makes [INT] orbs beneficial for all characters
support:
  type: descriptive
  criteria: Monkey D. Luffy, Dracule Mihawk, Ben Beckman, Yasopp and Lucky Roux
  levels:
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, randomizes orbs of Cerebral characters.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, randomizes orbs of Cerebral characters.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
      or Orb Manipulation, changes all orbs of Cerebral characters into [INT]
      orbs.
    - Once per adventure, when an enemy inflicts you with an Orb Randomization
