captain:
  name: ""
  description: Boosts ATK of [INT] characters by 4.25x at the start of the chain,
    boosts their HP by 1.4x, reduces Despair duration by 10 turns and deals 100x
    the damage taken from enemies in the previous turn in [INT] damage to all
    enemies at the end of each turn. Boosts ATK of [INT] characters by an
    additive 0.15x after each PERFECT in a row.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Dracule Mihawk, Crocodile (Mr. 0), Donquixote Doflamingo,
    Bartholomew Kuma, Gecko Moria, Boa Hancock, Jinbe, Marshall D. Teach
    (Blackbeard), Buggy or Edward Weevil, excluding Support members."
  description: Recovers 50% of crew's MAX HP and transforms all [INT] characters
    into Super [INT] characters.
special:
  name: "One Night of Horror: ROOM"
  description: Boosts Orb Effects of [INT] characters by 2.25x for 1 turn and
    protects from defeat for 1 turn. After 1 turn, boosts Orb Effects of [INT]
    characters by 2.5x for 1 turn.
  cooldown: 20
  maxLevel: 6
