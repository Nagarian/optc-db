captain:
  name: ""
  description: Boosts ATK of all characters by 4.25x and their HP by 1.5x. If a
    [STR] character has a [WANO] orb, boosts their ATK by 4.75x instead.
  notes: "[和]/[WANO] orbs replace [TND] orbs, count as beneficial for all
    characters, but boost by 2.5x instead, and can not be swapped by special
    abilities."
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Kin'emon, Kurozumi Kanjuro, Raizo, Kikunojo, Ashura Doji (Shutenmaru),
    Inuarashi, Nekomamushi, Kawamatsu, Denjiro (Kyoshiro), Kozuki Momonosuke,
    Kozuki Hiyori (Komurasaki), Gol D. Roger and Edward Newgate (Whitebeard),
    excluding Support members."
  description: Boosts base ATK of this character by 1000 for 1 turn, changes the
    orb, including [BLOCK] orb, of this character into a [WANO] orb and
    transforms all [STR] characters into Super [STR] characters.
special:
  name: Paradise Waterfall
  description: Changes [STR] orbs into [WANO] orbs for 2 turns, changes Matching
    orbs into [STR] orbs and boosts Orb Effects of [STR], Slasher and Free
    Spirit characters by 2.5x for 2 turns.
  cooldown: 20
  maxLevel: 6
