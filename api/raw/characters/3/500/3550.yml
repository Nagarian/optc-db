  description: Boosts ATK of Driven characters by 4.5x if they have a beneficial
    orb, by 3.75x otherwise and their HP by 1.4x. Lowers chances of getting
    [STR] orbs and makes [DEX] and [QCK] orbs beneficial for Driven characters.
special:
  name: "Life-Stealing Thousand Arrows: Flapping Thread"
  description: Deals 2.5x the damage dealt in Overkill Damage in the previous turn
    in Typeless damage to all enemies. If your crew has Normal Attack Only,
    boosts ATK of Driven characters by 2.5x for 1 turn and makes [PSY] and [INT]
    orbs beneficial for Driven characters for 1 turn.
  cooldown: 22
  maxLevel: 6
  notes: Overkill Damage is damage dealt over the enemies' current HP with normal
    attacks that killed them. For example, dealing 2,100,000 damage to an enemy
    with 1,000,000 HP will count as 1,100,000 Overkill Damage. This stacks for
    each enemy killed in the previous turn. The special caps out at 999,999,999
    damage.
