captain:
  name: ""
  description: Boosts ATK of [QCK], Slasher and Shooter characters by 4.75x, their
    HP by 1.5x, makes [QCK] and [DEX] orbs beneficial for [QCK], Slasher and
    Shooter characters and reduces Paralysis duration by 10 turns. If this
    character uses "Brothers Inseparable by Time", boosts ATK of [QCK], Slasher
    and Shooter characters by 5x instead for 3 turns.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Kozuki
    Oden, Kin'emon, Raizo, Ashura Doji, Dogstorm, Cat Viper, Kawamatsu, Denjiro,
    Kozuki Momonosuke, Kozuki Hiyori and Edward Newgate (Whitebeard), excluding
    Support members or crew must have Chain Addition, Chain Limit, Chain Lock or
    Chain Boundary."
  description: Increases boost effects of Chain Lock buffs by +0.3x, changes all
    orbs of middle row characters into [WANO] orbs and transforms all [QCK]
    characters into Super [QCK] characters.
special:
  name: Brothers Inseparable by Time
  description: Deals 100x character's ATK in Typeless damage to all enemies, locks
    the chain multiplier at 3.5x for 3 turns. If your Captain is a Slasher or
    Shooter character, increases duration of any Orb Effect buffs by 2 turns. If
    your crew has 5 or more Slasher characters, changes all orbs of top row
    characters into [WANO] orbs. If your crew has 5 or more Shooter characters,
    changes all orbs of bottom row characters into [WANO] orbs.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: When any other Slasher or Shooter character uses a special, reduces
      Special cooldown of this character by 1 turn
  - description: Boosts base ATK, HP and RCV of Slasher and Shooter characters by 75
