captain:
  name: ""
  description: Boosts ATK of Striker and Powerhouse characters by 5x, their HP by
    1.3x, makes [PSY] and [INT] orbs beneficial for Striker and Powerhouse
    characters, restores Special Cooldown of all characters by 10 turns when
    they are rewinded and deals ?x-400x character's ATK in Typeless damage to
    all enemies at the end of each turn depending on how many PERFECTs scored
    that turn.
  notes: "End of turn damage is based on how many PERFECTs you hit this turn: 0
    PERFECTs - ?x ATK; 1 PERFECT - ?x ATK; 2 PERFECTs - ?x ATK; 3 PERFECTs - ?x
    ATK; 4 PERFECTs - ?x ATK; 5 PERFECTs - ?x ATK; 6 PERFECTs - 400x ATK"
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Trafalgar D. Water Law, Basil Hawkins, Killer,
    Urouge, Eustass Kid, Scratchmen Apoo, Capone Bege, Jewelry Bonney, Page One,
    Ulti, Who's-Who, Black Maria and Sasaki, excluding Support members."
  description: Deals 100x character's ATK in Typeless True damage to all enemies,
    reduces Special Cooldown of Striker and Powerhouse characters by 1 turn,
    makes [DEX] and [QCK] orbs beneficial for Striker and Powerhouse characters
    for 1 turn and transforms all [STR] characters into Super [STR] characters.
special:
  name: X Calibur
  description: Deals 10% of enemies' current HP in True damage to all enemies and
    boosts ATK of Striker and Powerhouse characters by 2.5x for 1 turn. If your
    Captain is a Striker or Powerhouse character, sets Chain Boundaries to 3.0x
    and 40.0x for 1 turn, sets Chain Boundaries to 2.5x and 35.0x for 1 turn
    otherwise.
  cooldown: 19
  maxLevel: 6
sailor:
  - description: Boosts base ATK and HP of Striker and Powerhouse characters by 60
  - description: Makes [QCK] orbs beneficial for Striker and Powerhouse characters
