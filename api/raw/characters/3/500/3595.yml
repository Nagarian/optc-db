captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn, boosts ATK of
    [PSY], Fighter and Powerhouse characters by 4.75x, by 5x instead if they
    have a beneficial orb, boosts HP of [PSY], Fighter and Powerhouse characters
    by 1.4x, makes [INT] orbs beneficial for all characters and boosts EXP
    gained by 2.25x. One time per an adventure, if a crew member uses an ability
    with End of Turn Healing, activates "Marco Special" in the following turn.
superSpecial:
  criteria: This character must be captain and the crew must consist of 5 Fighter
    characters, excluding Support members.
  description: Deals 80x character's ATK in Typeless damage to all enemies,
    reduces Special Cooldown of Fighter characters by 1 turn, recovers 8,000 HP
    at the end of the turn for 2 turns and transforms all Fighter characters
    into Super Fighter characters.
special:
  name: Phoenix Brand
  description: Reduces Special Cooldown of all characters by 1 turn, deals 80x
    character's ATK in Typeless True damage to all enemies, recovers 10,000 HP
    and boosts ATK of [PSY], Fighter and Powerhouse characters by 2.5x for 2
    turns. After 1 turn, adds 1.4x to Chain multiplier for 1 turn.
  cooldown: 20
  maxLevel: 6
sailor:
