captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns at the start
    of the fight, boosts ATK of Fighter, Slasher, Striker, Cerebral and
    Powerhouse characters by 2.25x, makes [QCK] and [DEX] orbs beneficial for
    Fighter, Slasher, Striker, Cerebral and Powerhouse characters and deals
    100,000 Fixed damage to all enemies at the end of each turn. Reduces Special
    Cooldown of all characters by 2 turns at the start of Stage 3.
  notes: The bonus is cumulative. Characters with 2 of the boosted classes get a
    4.84x bonus.
special:
  name: Moon Raid
  description: Reduces the defense of all enemies by 100% for 1 turn, reduces
    Special Cooldown of Fighter, Slasher, Striker, Cerebral and Powerhouse
    characters by 3 turns, makes own attacks ignore damage reducing Barriers and
    Buffs for 3 turns, boosts Orb Effects of Fighter, Slasher, Striker, Cerebral
    and Powerhouse characters by 2.5x for 1 turn, reduces Special Cooldown of
    this character by 3 turns and becomes Carrot & Wanda for 3 turns.
  cooldown: 21
  maxLevel: 6
  stages:
    - description: Reduces the defense of all enemies by 100% for 1 turn, reduces
        Special Cooldown of Fighter, Slasher, Striker, Cerebral and Powerhouse
        characters by 1 turn, makes own attacks ignore damage reducing Barriers
        and Buffs for 1 turn, boosts Orb Effects of Fighter, Slasher, Striker,
        Cerebral and Powerhouse characters by 2x for 1 turn and becomes Carrot &
        Wanda for 1 turn.
      cooldown: 10
  notes: Special is limited to 2 uses per adventure.
