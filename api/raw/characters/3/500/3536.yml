captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 2 turns and advances
    Special Cooldown of this character to MAX at the start of the fight. Reduces
    Special Cooldown of this character by 5 turns at the start of Stage 3.
    Boosts ATK of [STR], [DEX] and [QCK] characters by 4x and boosts ATK of
    Fighter, Slasher, Striker and Shooter characters by an additional 1.25x. For
    10 turns at the start of the fight, boosts chances of getting Matching orbs
    and, if HP is above 50% at the start of the turn, attacks will ignore damage
    reducing Barriers and Buffs.
  notes: Attacks are still affected by DEF value. DEF boost buffs (Blue shield)
    still reduce your damage and you can not kill through Resilience, but Damage
    Negating (Yellow shield), % Damage Reduction (Rainbow shield), Barriers and
    Threshold Damage Reduction are ignored. Enemy attacks will go through YOUR
    defensive buffs.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Dogstorm, excluding Support members or you must reach the Boss Stage before
    10 turns pass."
  description: Deals 100x character's ATK in Typeless True damage to all enemies,
    reduces Special Cooldown of [STR], [DEX] and [QCK] characters by 1 turn and
    transforms all [DEX] characters into Super [DEX] characters.
special:
  name: Crimson Cat Dance
  description: Reduces Special Cooldown of all characters by 2 turns and boosts
    Orb Effects of [STR], [DEX] and [QCK] characters by 2.5x for 1 turn. After 1
    turn, boosts ATK of Fighter, Slasher, Striker and Shooter characters by 2.5x
    for 1 turn.
  cooldown: 20
  maxLevel: 6
