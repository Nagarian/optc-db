captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn, boosts ATK of
    Slasher and Free Spirit characters by 5x, their HP by 1.35x and makes [PSY]
    and [INT] orbs beneficial for Slasher and Free Spirit characters. If you
    defeated an enemy last turn, boosts ATK of Slasher and Free Spirit
    characters by 5.25x instead.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Kin'emon, Kurozumi Kanjuro, Raizo, Kikunojo, Shutenmaru, Dogstorm, Cat
    Viper, Kawamatsu, Denjiro, Kozuki Momonosuke, Kozuki Hiyori, Gol D. Roger
    and Edward Newgate (Whitebeard), excluding Support members."
  description: Boosts Chain Multiplier Growth Rate by 1.25x for 1 turn, changes
    all orbs into Matching orbs and transforms all Slasher characters into Super
    Slasher characters.
special:
  name: Valiant Way of Life
  description: Increases boost effects of ATK UP and Orb Amplification buffs
    applied by Slasher and Free Spirit characters by 0.25x for 3 turns. If HP is
    above 80% at the time the special is activated, boosts the Color Affinity of
    Slasher and Free Spirit characters by 2.5x for 1 turn, by 2.25x otherwise.
    If your crew has Color Affinity, boosts ATK of Slasher and Free Spirit
    characters by 2.25x for 3 turns. If HP is below 50% at the time the special
    is activated, reduces damage received by 95% for 1 turn and recovers 10,000
    HP.
  cooldown: 20
  maxLevel: 6
sailor:
  - description: Boosts base ATK, HP and RCV of all characters by 100
  - description: Makes [PSY] orbs beneficial for all characters
