captain:
  name: ""
  description: Reduces Special Cooldown of all characters by 1 turn at the start
    of the fight, boosts ATK of Free Spirit characters by 5x and makes [QCK],
    [RCV] and [TND] orbs beneficial for Free Spirit characters if HP is below
    30% at the start of the turn, boosts ATK of Free Spirit characters by 4.5x
    otherwise, boosts HP and RCV of Free Spirit characters by 1.3x and prevents
    defeat for 1 turn once per adventure.
  notes: Resilience activates when taking damage from an enemy that would kill
    you. This will not activate from damage taken from debuffs.
superSpecial:
  criteria: "This character must be captain and your crew must consist of: Monkey
    D. Luffy, Roronoa Zoro, Nami, Usopp, Vinsmoke Sanji, Tony Tony Chopper, Nico
    Robin, Franky and Jinbe, excluding Support members or HP must be below 30%."
  description: Increases duration of any team Percent Damage Reduction buffs by 1
    turn, increases boost effects of Chain Addition buffs by +0.5x and
    transforms all Free Spirit characters into Super Free Spirit characters.
special:
  name: "Soul Solid: Soul Notch Slash"
  description: Reduces Special Cooldown of Free Spirit characters by 1 turn,
    boosts base ATK of Free Spirit characters by 1000 for 1 turn and adds 1.6x
    to Chain multiplier for 1 turn. If HP is below 30% at the time the special
    is activated, changes all orbs, including [BLOCK] orbs, into Matching orbs
    and reduces damage received by 95% for 1 turn.
  cooldown: 19
  maxLevel: 6
