captain:
  name: ""
  description: Boosts ATK of all characters by 2.5x, by 3.25x instead if HP is
    above 99% at the start of the turn, makes [STR] and [QCK] orbs beneficial
    for all characters, deals 10% of enemies' current HP in damage to all
    enemies at the end of each turn and revives the team after a GAME OVER once
    per adventure.
  notes: The revive is not Resilience since you can still die, it's similar to
    using a gem to revive. This does not work when you are despaired as it
    nullifies all captain effects.
special:
  name: "Three-Pace Hum: Soul Notch Slash"
  description: Recovers 14,343 HP, recovers 4,343 HP at the end of the turn for 3
    turns, adds 0.8x to Chain multiplier for 2 turns, reduces damage received by
    90% for 1 turn, changes [BLOCK] orbs into Matching orbs and makes [STR],
    [DEX], [QCK], [PSY] and [INT] orbs beneficial for all characters for 2
    turns. If the HP of the enemy with the highest Maximum HP is below 434,300,
    instantly defeats all enemies, otherwise, delays all enemies by 1 turn,
    deals 20% of enemies' current HP in damage to all enemies.
  cooldown: 19
  maxLevel: 6
