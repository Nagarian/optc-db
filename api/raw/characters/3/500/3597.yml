captain:
  name: ""
  description: Boosts ATK of [PSY] and [INT] characters by 4.75x, by 5.25x instead
    if they have a [SEMLA] orb, boosts HP of [PSY] and [INT] characters by 1.5x,
    changes [RCV] and [DEX] orbs into [SEMLA] orbs, makes [SEMLA] orbs
    beneficial for all characters and makes PERFECTs consume [SEMLA] orbs. At
    the start of the fight, this character activates their own special.
superSpecial:
  criteria: "This character must be captain and your crew must consist of:
    Charlotte Katakuri, Charlotte Cracker, Charlotte Smoothie, Charlotte
    Perospero, Charlotte Daifuku, Charlotte Oven, Charlotte Amande, Charlotte
    Opera, Charlotte Brulee, Charlotte Montd'Or, Charlotte Galette, Charlotte
    Bavarois, Charlotte Pudding or Charlotte Flampe, excluding Support members."
  description: Deals 75x character's ATK in Typeless damage to all enemies, boosts
    ATK of [PSY] and [INT] characters by 2.25x for 1 turn and transforms all
    [INT] characters into Super [INT] characters.
special:
  name: God of Lightning Tenjin
  description: Deals 20% of enemies' current HP in damage to all enemies, changes
    all orbs, including [BLOCK] orbs into [SEMLA] orbs and boosts Orb Effects of
    [PSY] and [INT] characters by 2.5x for 1 turn. Applies a Continuous Effect
    that deals 20% of enemies' current HP in damage to all enemies at the start
    of every stage, deals 500x character's ATK in [INT] damage to all enemies at
    the end of each turn, paralyzes (30%) all enemies for 1 turn at the end of
    each turn for 99 turns and reduces enemies' Percent Damage Reduction and
    Threshold Damage Reduction duration by 1 turn at the end of each turn for 99
    turns.
  cooldown: 21
  maxLevel: 6
  notes: The Continuous Effect applied by this Special is not a buff and will not
    be cleared by Buff Clearing effects.
sailor:
